name: Sync Main And Fix Project Adapter

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - tools/sync_main_fix_project_adapter.py
      - .github/workflows/sync-main-and-fix-project-adapter.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0

      - name: Checkout pinned Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Merge current main with bounded conflict handling
        run: |
          set -euo pipefail
          git config user.name 'alsdmlals4-eng'
          git config user.email 'alsdmlals4@gmail.com'
          git fetch origin main --no-tags
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'merge conflicts:\n%s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "tests/test_base_v942_planning_first_adoption.py" ]; then
              echo 'Unexpected main synchronization conflicts.' >&2
              exit 1
            fi
            git checkout --ours tests/test_base_v942_planning_first_adoption.py
            git add tests/test_base_v942_planning_first_adoption.py
          fi

      - name: Repair merged planning and adapter contracts
        run: |
          python -m py_compile tools/sync_main_fix_project_adapter.py
          python tools/sync_main_fix_project_adapter.py

      - name: Regenerate and validate operating artifacts
        run: |
          python -m pip install -r .base-contract/.github/validation-requirements.txt
          PROTECTED_BASE_SHA="$(python -c 'import json; print(json.load(open("skills/PROJECT_BASE_ADAPTER.json", encoding="utf-8"))["protected_baseline"]["commit"])')"
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --write
          python -m unittest \
            tests.test_base_v942_planning_first_adoption \
            tests.test_project_adapter_long_lived_pr_baseline \
            tests.test_r2_artistry_generation_growth_economy \
            tests.test_r2_customer_equipment_compatibility \
            tests.test_r2_mobile_customer_card_progressive_disclosure \
            tests.test_r2_enhancement_dominant_simple_load_gate \
            tests.test_r2_equipment_base_weight_points \
            tests.test_r2_weight_performance_budget_and_lightweight_tradeoff \
            tests.test_r2_weight_budget_conversion_and_role_presets \
            tests.test_r2_item_role_stat_and_initial_function_catalog \
            tests.test_r2_initial_role_stat_preset_and_enhancement_function_ownership \
            tests.test_r2_function_recipe_material_fit_and_playtest \
            -v
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --check

      - name: Verify protected product paths
        run: |
          if git diff --name-only HEAD -- data scripts scenes assets addons project.godot | grep -q .; then
            echo 'Protected product path changed during main synchronization.' >&2
            git diff --name-only HEAD -- data scripts scenes assets addons project.godot >&2
            exit 1
          fi

      - name: Remove one-shot files and commit merge
        run: |
          rm -rf .base-contract
          git rm tools/sync_main_fix_project_adapter.py
          git rm .github/workflows/sync-main-and-fix-project-adapter.yml
          git add -A
          git commit -m 'merge: sync main and fix long-lived adapter validation'
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
