name: Sync Main And Fix Project Adapter

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - .github/workflows/sync-main-and-fix-project-adapter.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0

      - name: Checkout pinned Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Merge current main with bounded conflict handling
        run: |
          set -euo pipefail
          git config user.name 'alsdmlals4-eng'
          git config user.email 'alsdmlals4@gmail.com'
          git fetch origin main --no-tags
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'merge conflicts:\n%s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "tests/test_base_v942_planning_first_adoption.py" ]; then
              echo 'Unexpected main synchronization conflicts.' >&2
              exit 1
            fi
            git checkout --ours tests/test_base_v942_planning_first_adoption.py
            git add tests/test_base_v942_planning_first_adoption.py
          fi

      - name: Repair merged planning and adapter contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path('.')

          planning = root / 'tests/test_base_v942_planning_first_adoption.py'
          text = planning.read_text(encoding='utf-8')
          if 'MIGRATION_STATE = ROOT / "docs/operations/BLACKSMITH_ADAPTER_MIGRATION_STATE_2026-08-06.json"' not in text:
              text = text.replace(
                  'ADAPTER = ROOT / "skills/PROJECT_BASE_ADAPTER.json"\n',
                  'ADAPTER = ROOT / "skills/PROJECT_BASE_ADAPTER.json"\n'
                  'MIGRATION_STATE = ROOT / "docs/operations/BLACKSMITH_ADAPTER_MIGRATION_STATE_2026-08-06.json"\n',
                  1,
              )
          old = '        self.assertEqual("BLOCKED", adapter["project_operating_state"]["product_implementation"])'
          new = (
              '        migration = load_json(MIGRATION_STATE)\n'
              '        preserved = migration["migrated_adapter_root_fields"]["project_operating_state"]\n'
              '        self.assertEqual("BLOCKED", preserved["product_implementation"])'
          )
          if old in text:
              text = text.replace(old, new, 1)
          planning.write_text(text, encoding='utf-8')

          health_path = root / 'docs/PROJECT_OPERATING_HEALTH.json'
          health = json.loads(health_path.read_text(encoding='utf-8'))
          current_hash = hashlib.sha256((root / 'CURRENT_CONFIRMED_DECISIONS.md').read_bytes()).hexdigest()
          record = next(
              item for item in health['evidence']['operating']
              if item['id'] == 'BS-CURRENT-DECISIONS'
          )
          record['sha256'] = current_hash
          health_path.write_text(
              json.dumps(health, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          workflow = root / '.github/workflows/validate-project-base-adapter.yml'
          workflow.write_text('''name: Validate Project Base Adapter

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check out Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Select the trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          git fetch origin "$PR_BASE_REF" --no-tags
          LATEST_BASE_SHA="$(git rev-parse "origin/$PR_BASE_REF")"
          ADAPTER_CHANGES="$(git diff --name-only "$PR_BASE_SHA"..."$PR_HEAD_SHA" -- "$ADAPTER_PATH")"
          if printf '%s\n' "$ADAPTER_CHANGES" | grep -Fxq "$ADAPTER_PATH"; then
            # Adapter migration PR: the adapter must explicitly adopt the latest base tip.
            PROTECTED_BASE_SHA="$LATEST_BASE_SHA"
          else
            # Normal PR: use the current merged adapter record, not the stale original PR base.
            PROTECTED_BASE_SHA="$(
              python -c 'import json, sys; payload = json.load(sys.stdin); print(payload["protected_baseline"]["commit"])' < "$ADAPTER_PATH"
            )"
          fi
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$LATEST_BASE_SHA"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Validate adapter against the trusted protected baseline
        run: |
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --check
''', encoding='utf-8')
          PY

      - name: Regenerate and validate operating artifacts
        run: |
          python -m pip install -r .base-contract/.github/validation-requirements.txt
          PROTECTED_BASE_SHA="$(python -c 'import json; print(json.load(open("skills/PROJECT_BASE_ADAPTER.json", encoding="utf-8"))["protected_baseline"]["commit"])')"
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --write
          python -m unittest \
            tests.test_base_v942_planning_first_adoption \
            tests.test_project_adapter_long_lived_pr_baseline \
            tests.test_r2_artistry_generation_growth_economy \
            tests.test_r2_customer_equipment_compatibility \
            tests.test_r2_mobile_customer_card_progressive_disclosure \
            tests.test_r2_enhancement_dominant_simple_load_gate \
            tests.test_r2_equipment_base_weight_points \
            tests.test_r2_weight_performance_budget_and_lightweight_tradeoff \
            tests.test_r2_weight_budget_conversion_and_role_presets \
            tests.test_r2_item_role_stat_and_initial_function_catalog \
            tests.test_r2_initial_role_stat_preset_and_enhancement_function_ownership \
            tests.test_r2_function_recipe_material_fit_and_playtest \
            -v
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --check

      - name: Verify protected product paths
        run: |
          if git diff --name-only HEAD -- data scripts scenes assets addons project.godot | grep -q .; then
            echo 'Protected product path changed during main synchronization.' >&2
            git diff --name-only HEAD -- data scripts scenes assets addons project.godot >&2
            exit 1
          fi

      - name: Remove one-shot workflow and commit merge
        run: |
          rm -rf .base-contract
          git rm .github/workflows/sync-main-and-fix-project-adapter.yml
          git add -A
          git commit -m 'merge: sync main and fix long-lived adapter validation'
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
