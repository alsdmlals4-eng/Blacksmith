name: One-shot R3 current test pointer repair

on:
  push:
    branches:
      - docs/r3-noble-01-heirloom-succession

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[current-tests-decision06]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r3-noble-01-heirloom-succession
          fetch-depth: 0
      - name: Advance only current-state assertions to Decision06
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('tests/test_r3_adventurer_02_toren_content.py'),
              Path('tests/test_r3_soldier_01_marek_content.py'),
              Path('tests/test_r3_collector_01_ersa_content.py'),
              Path('tests/test_r3_gladiator_01_cassia_content.py'),
          ]
          replacements = [
              ('self.assertEqual("4/10", registry.get("next_approval_counter"))', 'self.assertEqual("6/10", registry.get("next_approval_counter"))'),
              ('self.assertEqual("5/10", registry.get("next_approval_counter"))', 'self.assertEqual("6/10", registry.get("next_approval_counter"))'),
              ('R3_R7_APPROVAL_COUNTER: 5/10', 'R3_R7_APPROVAL_COUNTER: 6/10'),
              ('R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-05', 'R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-06'),
              ('현재 Decision은 `BS-CONTENT-20260811-05`', '현재 Decision은 `BS-CONTENT-20260811-06`'),
              ('현재 연속 작업은 `BS-CONTENT-20260811-05`', '현재 연속 작업은 `BS-CONTENT-20260811-06`'),
              ('현재 승인 카운터: `5/10`.', '현재 승인 카운터: `6/10`.'),
              ('Decision: `BS-CONTENT-20260811-05`.', 'Decision: `BS-CONTENT-20260811-06`.'),
              ('test_current_routers_preserve_marek_history_while_cassia_is_current', 'test_current_routers_preserve_marek_history_while_noble01_is_current'),
              ('test_current_routers_preserve_ersa_history_while_cassia_is_current', 'test_current_routers_preserve_ersa_history_while_noble01_is_current'),
              ('test_current_routers_move_to_five_of_ten_without_opening_product_code', 'test_current_routers_preserve_cassia_history_while_noble01_is_current'),
              ('test_current_entrypoints_preserve_toren_history_while_ersa_is_current', 'test_current_entrypoints_preserve_toren_history_while_noble01_is_current'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/r3-noble-01-current-tests.yml')
          if workflow.exists():
              workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: advance R3 current assertions to Decision06 [current-tests-decision06]"
          git push origin HEAD:docs/r3-noble-01-heirloom-succession
