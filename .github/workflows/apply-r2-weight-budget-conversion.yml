name: Apply R2 Weight Budget Conversion Canon

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - .github/workflows/apply-r2-weight-budget-conversion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 41a20584dd2ee51d917e5c9d7cab6838e1ceba7e
          path: base-src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assemble and validate synchronizer
        run: |
          cat \
            tools/.weight-budget-conversion-part1 \
            tools/.weight-budget-conversion-part2 \
            tools/.weight-budget-conversion-part3 \
            tools/.weight-budget-conversion-part4 \
            tools/.weight-budget-conversion-part5 \
            > tools/apply_r2_weight_budget_conversion.py
          python -m py_compile tools/apply_r2_weight_budget_conversion.py
      - name: Apply canon synchronization
        run: python tools/apply_r2_weight_budget_conversion.py
      - name: Repair active authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "tests/test_base_v942_planning_first_adoption.py": [
                  ('self.assertIn("R2_BATCH_005_6_OF_10", game_bible)', 'self.assertIn("R2_BATCH_005_7_OF_10", game_bible)'),
                  ('self.assertIn("R2_BATCH_005_6_OF_10", active)', 'self.assertIn("R2_BATCH_005_7_OF_10", active)'),
              ],
              "tests/test_r2_mobile_customer_card_progressive_disclosure.py": [
                  ('self.assertIn("R2_BATCH_005_5_OF_10", bible)', 'self.assertIn("R2_BATCH_005_7_OF_10", bible)'),
                  ('self.assertIn("현재 승인 카운터: `6/10`", active)', 'self.assertIn("현재 승인 카운터: `7/10`", active)'),
              ],
              "tests/check_project_core_alignment.py": [
                  ('        "next_approval_counter": "6/10",', '        "next_approval_counter": "7/10",'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text and new not in text:
                      raise SystemExit(f"missing active assertion: {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Run focused contracts
        run: >-
          python -m unittest
          tests.test_base_v942_planning_first_adoption
          tests.test_r2_artistry_generation_growth_economy
          tests.test_r2_customer_equipment_compatibility
          tests.test_r2_mobile_customer_card_progressive_disclosure
          tests.test_r2_enhancement_dominant_simple_load_gate
          tests.test_r2_equipment_base_weight_points
          tests.test_r2_weight_performance_budget_and_lightweight_tradeoff
          tests.test_r2_weight_budget_conversion_and_role_presets
          -v
      - name: Run project core alignment
        run: python tests/check_project_core_alignment.py
      - name: Run operating audit
        run: >-
          python tools/run_project_operating_system_audit.py
          --base-root base-src
          --report /tmp/blacksmith-base-adoption-report.json
      - name: Remove one-shot files
        run: |
          rm -rf base-src
          rm tools/apply_r2_weight_budget_conversion.py
          rm tools/.weight-budget-conversion-part1
          rm tools/.weight-budget-conversion-part2
          rm tools/.weight-budget-conversion-part3
          rm tools/.weight-budget-conversion-part4
          rm tools/.weight-budget-conversion-part5
          rm .github/workflows/apply-r2-weight-budget-conversion.yml
      - name: Commit and push synchronized canon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: canonize weight budget conversion and role presets"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
