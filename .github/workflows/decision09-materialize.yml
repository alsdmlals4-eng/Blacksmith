name: Decision09 planning materializer

on:
  push:
    branches:
      - docs/r3-gladiator-02-kyle-veteran-continuity
    paths:
      - 'tools/_decision09_materialize.py'
      - '.github/workflows/decision09-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r3-gladiator-02-kyle-veteran-continuity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize approved planning state and prove focused GREEN
        run: python tools/_decision09_materialize.py
      - name: Commit planning-only materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: materialize Kyle continuity as R3 9 of 10"
          git push origin HEAD:docs/r3-gladiator-02-kyle-veteran-continuity
