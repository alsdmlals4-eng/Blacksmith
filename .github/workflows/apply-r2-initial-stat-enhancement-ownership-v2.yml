name: Apply R2 Initial Stat and Enhancement Ownership Canon V2

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - .github/workflows/apply-r2-initial-stat-enhancement-ownership-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 41a20584dd2ee51d917e5c9d7cab6838e1ceba7e
          path: base-src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Repair synchronizer audit insertion anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_r2_initial_stat_enhancement_ownership.py")
          text = path.read_text(encoding="utf-8")
          start_token = "    anchor = '}\\n\\nHISTORICAL_ASSERTIONS = {'"
          end_token = "    write(relative, text)"
          start = text.index(start_token)
          end = text.index(end_token, start)
          replacement = '''    anchor = '    "docs/planning/BLACKSMITH_R2_ITEMIZATION_BENCHMARK_2026-08-05.md": (\\n'
          if new_required not in text:
              if anchor not in text:
                  raise RuntimeError("operating audit assertion insertion anchor missing")
              text = text.replace(anchor, new_required + anchor, 1)
'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Validate synchronizer
        run: python -m py_compile tools/apply_r2_initial_stat_enhancement_ownership.py
      - name: Apply canon synchronization
        run: python tools/apply_r2_initial_stat_enhancement_ownership.py
      - name: Validate JSON
        run: |
          python -m json.tool docs/planning/CURRENT_R2_CANON_REGISTRY.json > /dev/null
          python -m json.tool '[기획서]/00_프로젝트_허브/DESIGN_DOCUMENT_REGISTRY.json' > /dev/null
      - name: Run focused contracts
        run: >-
          python -m unittest
          tests.test_base_v942_planning_first_adoption
          tests.test_r2_artistry_generation_growth_economy
          tests.test_r2_customer_equipment_compatibility
          tests.test_r2_mobile_customer_card_progressive_disclosure
          tests.test_r2_enhancement_dominant_simple_load_gate
          tests.test_r2_equipment_base_weight_points
          tests.test_r2_weight_performance_budget_and_lightweight_tradeoff
          tests.test_r2_weight_budget_conversion_and_role_presets
          tests.test_r2_item_role_stat_and_initial_function_catalog
          tests.test_r2_initial_role_stat_preset_and_enhancement_function_ownership
          -v
      - name: Run project core alignment
        run: python tests/check_project_core_alignment.py
      - name: Run operating audit
        run: >-
          python tools/run_project_operating_system_audit.py
          --base-root base-src
          --report /tmp/blacksmith-base-adoption-report.json
      - name: Verify protected product paths unchanged
        run: |
          changed=$(git diff --name-only 476ddc380079dd61d67cda4c065a80819355292f...HEAD -- \
            data scripts scenes assets addons project.godot | grep -v '^data/crafting/weapon_bases.json$' || true)
          test -z "$changed" || { echo "$changed"; exit 1; }
          git diff --quiet 476ddc380079dd61d67cda4c065a80819355292f...HEAD -- data/crafting/weapon_bases.json
      - name: Remove one-shot files
        run: |
          rm -rf base-src
          rm tools/apply_r2_initial_stat_enhancement_ownership.py
          rm -f .github/workflows/apply-r2-initial-stat-enhancement-ownership.yml
          rm .github/workflows/apply-r2-initial-stat-enhancement-ownership-v2.yml
      - name: Commit and push synchronized canon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: synchronize initial stat and enhancement ownership canon"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
