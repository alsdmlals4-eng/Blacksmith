name: Apply R2 Item Role Stat and Function Catalog Canon V4

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - .github/workflows/apply-r2-item-role-function-catalog-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 41a20584dd2ee51d917e5c9d7cab6838e1ceba7e
          path: base-src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Repair synchronizer anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_r2_item_role_function_catalog.py")
          text = path.read_text(encoding="utf-8")
          old = "    anchor = '    \"docs/planning/BLACKSMITH_R2_ITEMIZATION_BENCHMARK_2026-08-05.md\": ('"
          new = "    anchor = '}\\n\\nFORBIDDEN = {'"
          if old not in text and new not in text:
              raise SystemExit("missing core-alignment anchor definition")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate and apply synchronizer
        run: |
          python -m py_compile tools/apply_r2_item_role_function_catalog.py
          python tools/apply_r2_item_role_function_catalog.py
      - name: Repair active assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "tests/test_r2_mobile_customer_card_progressive_disclosure.py": [
                  ('self.assertIn("현재 승인 카운터: `7/10`", active)', 'self.assertIn("현재 승인 카운터: `8/10`", active)'),
              ],
              "tools/audit_project_operating_system.py": [
                  ('"현재 승인 카운터: `7/10`"', '"현재 승인 카운터: `8/10`"'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text and new not in text:
                      raise SystemExit(f"missing active assertion: {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Validate JSON and focused contracts
        run: |
          python -m json.tool docs/planning/CURRENT_R2_CANON_REGISTRY.json > /dev/null
          python -m json.tool '[기획서]/00_프로젝트_허브/DESIGN_DOCUMENT_REGISTRY.json' > /dev/null
          python -m unittest \
            tests.test_base_v942_planning_first_adoption \
            tests.test_r2_artistry_generation_growth_economy \
            tests.test_r2_customer_equipment_compatibility \
            tests.test_r2_mobile_customer_card_progressive_disclosure \
            tests.test_r2_enhancement_dominant_simple_load_gate \
            tests.test_r2_equipment_base_weight_points \
            tests.test_r2_weight_performance_budget_and_lightweight_tradeoff \
            tests.test_r2_weight_budget_conversion_and_role_presets \
            tests.test_r2_item_role_stat_and_initial_function_catalog -v
      - name: Run alignment and operating audit
        run: |
          python tests/check_project_core_alignment.py
          python tools/run_project_operating_system_audit.py \
            --base-root base-src \
            --report /tmp/blacksmith-base-adoption-report.json
      - name: Verify protected product paths unchanged
        run: |
          changed=$(git diff --name-only 476ddc380079dd61d67cda4c065a80819355292f...HEAD -- \
            data scripts scenes assets addons project.godot | grep -v '^data/crafting/weapon_bases.json$' || true)
          test -z "$changed" || { echo "$changed"; exit 1; }
          git diff --quiet 476ddc380079dd61d67cda4c065a80819355292f...HEAD -- data/crafting/weapon_bases.json
      - name: Remove one-shot files
        run: |
          rm -rf base-src
          rm tools/apply_r2_item_role_function_catalog.py
          rm -f .github/workflows/apply-r2-item-role-function-catalog.yml
          rm -f .github/workflows/apply-r2-item-role-function-catalog-v2.yml
          rm -f .github/workflows/apply-r2-item-role-function-catalog-v3.yml
          rm .github/workflows/apply-r2-item-role-function-catalog-v4.yml
      - name: Commit and push synchronized canon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: canonize item role stats and initial function catalog"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
