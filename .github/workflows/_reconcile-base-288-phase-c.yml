name: Reconcile Base 288 Phase C

on:
  push:
    branches:
      - ops/blacksmith-dedicated-local-executor-bootstrap
    paths:
      - .github/workflows/_reconcile-base-288-phase-c.yml
      - tools/_reconcile_base_288_phase_c.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/blacksmith-dedicated-local-executor-bootstrap
          fetch-depth: 0
      - name: Reconcile Base 288 and Phase C current consumers
        run: python tools/_reconcile_base_288_phase_c.py
      - name: Remove one-shot reconciliation helpers
        run: |
          rm tools/_reconcile_base_288_phase_c.py
          rm .github/workflows/_reconcile-base-288-phase-c.yml
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ops: reconcile Base dedicated local environment contract"
          git push origin HEAD:ops/blacksmith-dedicated-local-executor-bootstrap
