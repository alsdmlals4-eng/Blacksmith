name: Apply Checkpoint 005 Final Validation Fix

on:
  pull_request:
    types:
      - synchronize
    paths:
      - "tools/fix_checkpoint_005_final_validation.py"
      - ".github/workflows/apply-checkpoint-005-final-validation-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/finalize-r2-checkpoint-005-main-canon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final validation fix
        run: python tools/fix_checkpoint_005_final_validation.py
      - name: Commit validation fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No validation fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_OPERATING_HEALTH.json \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/ROADMAP.md' \
            '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md'
          git commit -m "fix: close checkpoint 005 validation gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
