name: Repair Equipment Weight Synchronizer Indentation

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - ".github/workflows/repair-equipment-weight-indent.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
      - name: Repair exact indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_equipment_base_weight_points_canon.py")
          text = path.read_text(encoding="utf-8")
          broken = '''    if path.endswith("test_r2_enhancement_dominant_simple_load_gate.py"):
            text = text.replace('self.assertIn("R2_BATCH_005 / 4/10", current)', 'self.assertIn("R2_BATCH_005 / 5/10", current)')
          '''
          fixed = '''    if path.endswith("test_r2_enhancement_dominant_simple_load_gate.py"):
              text = text.replace('self.assertIn("R2_BATCH_005 / 4/10", current)', 'self.assertIn("R2_BATCH_005 / 5/10", current)')
          '''
          if broken not in text:
              # Normalize any malformed indentation immediately after the exact if line.
              lines = text.splitlines()
              for i, line in enumerate(lines[:-1]):
                  if line == '    if path.endswith("test_r2_enhancement_dominant_simple_load_gate.py"):' and 'self.assertIn("R2_BATCH_005 / 4/10", current)' in lines[i + 1]:
                      lines[i + 1] = '        ' + lines[i + 1].lstrip()
                      text = "\n".join(lines) + "\n"
                      break
              else:
                  raise SystemExit("malformed target block not found")
          else:
              text = text.replace(broken, fixed, 1)
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove one-shot repair workflow
        run: rm .github/workflows/repair-equipment-weight-indent.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: repair equipment weight synchronizer indentation"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
