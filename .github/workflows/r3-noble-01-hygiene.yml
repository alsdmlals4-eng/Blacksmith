name: One-shot R3 Noble 01 hygiene repair

on:
  push:
    branches:
      - docs/r3-noble-01-heirloom-succession

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[hygiene-decision06]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r3-noble-01-heirloom-succession
          fetch-depth: 0
      - name: Normalize router EOF and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md'),
              Path('[기획서]/00_프로젝트_허브/START_HERE.md'),
              Path('[기획서]/00_프로젝트_허브/ROADMAP.md'),
              Path('[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.rstrip() + '\n', encoding='utf-8')
          workflow = Path('.github/workflows/r3-noble-01-hygiene.yml')
          if workflow.exists():
              workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize Decision06 router EOF [hygiene-decision06]"
          git push origin HEAD:docs/r3-noble-01-heirloom-succession
