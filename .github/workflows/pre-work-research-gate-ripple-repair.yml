name: Repair pre-work research gate ripples

on:
  push:
    branches:
      - docs/pre-work-research-gate
    paths:
      - .github/workflows/pre-work-research-gate-ripple-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pre-work-research-gate
          fetch-depth: 0
      - name: Repair compatibility and health evidence
        run: python tools/_repair_pre_work_research_gate_ripples.py
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: reconcile research gate validation ripples'
          git push origin HEAD:docs/pre-work-research-gate
