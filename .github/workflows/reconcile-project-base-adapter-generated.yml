name: Reconcile Project Base Adapter Generated Views

on:
  push:
    branches:
      - ops/reconcile-toolchain-activation-main
    paths:
      - skills/PROJECT_BASE_ADAPTER.json
      - .github/workflows/reconcile-project-base-adapter-generated.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check out exact Base validator/generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Generate canonical adapter views
        run: |
          set -euo pipefail
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base 2dddf864519a557152c6bbf0f0ee7fb94eadf11c \
            --write

      - name: Fail closed on unexpected generated paths
        run: |
          set -euo pipefail
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(\.base-contract/|skills/BASE_V9_ADAPTER\.json|skills/PROJECT_BASE_SKILL_ADAPTER\.json|skills/PROJECT_SKILL_SNAPSHOT\.json|docs/PROJECT_OPERATING_DASHBOARD\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generator output:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit exact generated bytes to repair branch
        run: |
          set -euo pipefail
          git add -- \
            skills/BASE_V9_ADAPTER.json \
            skills/PROJECT_BASE_SKILL_ADAPTER.json \
            skills/PROJECT_SKILL_SNAPSHOT.json \
            docs/PROJECT_OPERATING_DASHBOARD.html
          if git diff --cached --quiet; then
            echo 'Generated views already current.'
            exit 0
          fi
          git config user.name 'blacksmith-ops-bot'
          git config user.email 'blacksmith-ops-bot@users.noreply.github.com'
          git commit -m 'ops: regenerate protected baseline adapter views'
          git push origin HEAD:ops/reconcile-toolchain-activation-main
