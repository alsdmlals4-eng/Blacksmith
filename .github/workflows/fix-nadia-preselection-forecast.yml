name: Restore Nadia pre-selection forecast

on:
  push:
    branches:
      - agent/r3-nadia-information-result-detail
    paths:
      - ".github/workflows/fix-nadia-preselection-forecast.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r3-nadia-information-result-detail
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Preserve existing disclosure strength
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/planning/BLACKSMITH_R3_ADVENTURER_01_NADIA_VENN_RUINS_SURVIVAL_RECOVERY_CANON_2026.md')
          text = path.read_text(encoding='utf-8')
          anchor = '- 현재 탐사와 실제로 관련된 주·보조 적성만\n- 현재 선택 작품이 없을 때도 명확한 주 행동 `작품 선택`\n'
          replacement = '- 현재 탐사와 실제로 관련된 주·보조 적성만\n- 고객 능력과 알려진 사건 위험 기준의 `작품 미선택 기본 예상 성공률: 약 N%`\n- 현재 선택 작품이 없을 때도 명확한 주 행동 `작품 선택`\n'
          if anchor not in text:
              raise SystemExit('expected default-card anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          python -m unittest tests.test_r3_adventurer_01_nadia_content -v
      - name: Commit minimal regression fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/planning/BLACKSMITH_R3_ADVENTURER_01_NADIA_VENN_RUINS_SURVIVAL_RECOVERY_CANON_2026.md
          git commit -m 'docs: preserve Nadia pre-selection success forecast'
          git push origin HEAD:agent/r3-nadia-information-result-detail
