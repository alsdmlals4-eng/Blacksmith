name: Validate Base v9.4.2 Planning First Adoption

on:
  pull_request:
    paths:
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "docs/PROJECT_OPERATING_HEALTH.json"
      - "docs/planning/BLACKSMITH_R2_BATCH_006_VERTICAL_SLICE_CANON_PROPOSAL_2026.md"
      - "docs/planning/R2_BATCH_006_VERTICAL_SLICE_PROPOSAL_REGISTRY.json"
      - "docs/planning/BLACKSMITH_R2_VERTICAL_SLICE_BENCHMARK_2026-08-06.md"
      - "docs/planning/CURRENT_R2_CANON_REGISTRY.json"
      - "CURRENT_CONFIRMED_DECISIONS.md"
      - '\[기획서\]/00_프로젝트_허브/ACTIVE_CONTEXT.md'
      - "docs/superpowers/plans/2026-08-06-blacksmith-godot-vertical-slice.md"
      - "tools/finalize_r2_batch_006_counter_and_evidence.py"
      - "tests/test_base_v942_planning_first_adoption.py"
      - "tests/test_project_adapter_long_lived_pr_baseline.py"
      - "tests/test_r2_artistry_generation_growth_economy.py"
      - "tests/test_r2_customer_equipment_compatibility.py"
      - "tests/test_r2_mobile_customer_card_progressive_disclosure.py"
      - "tests/test_r2_enhancement_dominant_simple_load_gate.py"
      - "tests/test_r2_equipment_base_weight_points.py"
      - "tests/test_r2_weight_performance_budget_and_lightweight_tradeoff.py"
      - "tests/test_r2_weight_budget_conversion_and_role_presets.py"
      - "tests/test_r2_item_role_stat_and_initial_function_catalog.py"
      - "tests/test_r2_initial_role_stat_preset_and_enhancement_function_ownership.py"
      - "tests/test_r2_function_recipe_material_fit_and_playtest.py"
      - "tests/test_r2_checkpoint_005_postmerge_closure.py"
      - "tests/test_r2_checkpoint_005_main_canon_finalization.py"
      - "tests/test_r2_batch_006_vertical_slice_proposal.py"
      - "tests/test_r2_batch_006_main_canon_closure.py"
      - ".github/workflows/validate-project-base-adapter.yml"
      - ".github/workflows/validate-base-v942-planning-first-adoption.yml"

permissions:
  contents: write

jobs:
  apply-finalization:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/close-r2-batch-006-main-canon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python tools/finalize_r2_batch_006_counter_and_evidence.py
      - shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_CONFIRMED_DECISIONS.md \
            docs/planning/BLACKSMITH_R2_BATCH_006_VERTICAL_SLICE_CANON_PROPOSAL_2026.md \
            docs/planning/CURRENT_R2_CANON_REGISTRY.json \
            docs/PROJECT_OPERATING_HEALTH.json \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/ROADMAP.md' \
            '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md' \
            tests
          git commit -m "fix: finalize Batch 006 counters and evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  contract:
    needs: apply-finalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m unittest
          tests.test_base_v942_planning_first_adoption
          tests.test_project_adapter_long_lived_pr_baseline
          tests.test_r2_artistry_generation_growth_economy
          tests.test_r2_customer_equipment_compatibility
          tests.test_r2_mobile_customer_card_progressive_disclosure
          tests.test_r2_enhancement_dominant_simple_load_gate
          tests.test_r2_equipment_base_weight_points
          tests.test_r2_weight_performance_budget_and_lightweight_tradeoff
          tests.test_r2_weight_budget_conversion_and_role_presets
          tests.test_r2_item_role_stat_and_initial_function_catalog
          tests.test_r2_initial_role_stat_preset_and_enhancement_function_ownership
          tests.test_r2_function_recipe_material_fit_and_playtest
          tests.test_r2_checkpoint_005_postmerge_closure
          tests.test_r2_checkpoint_005_main_canon_finalization
          tests.test_r2_batch_006_vertical_slice_proposal
          tests.test_r2_batch_006_main_canon_closure
          -v
