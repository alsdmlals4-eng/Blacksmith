name: Repair Cassia Operating Audit Once

on:
  push:
    branches:
      - plan/r3-gladiator-01-cassia-5of10
    paths:
      - tools/_repair_cassia_operating_audit.py
      - .github/workflows/_repair-cassia-operating-audit.yml

permissions:
  contents: write

concurrency:
  group: repair-cassia-operating-audit
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair operating audit current-state routing
        run: python tools/_repair_cassia_operating_audit.py
      - name: Verify operating audit and Cassia contracts
        run: |
          python -m unittest tests.test_project_operating_system_audit_runner -v
          python -m unittest tests.test_r3_gladiator_01_cassia_content -v
      - name: Commit repaired operating audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No audit repair changes'; exit 1; }
          git commit -m 'test: advance operating audit to Cassia 5 of 10'
          git push origin HEAD:${GITHUB_REF_NAME}
