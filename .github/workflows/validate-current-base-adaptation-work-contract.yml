name: Validate Current Base Adaptation Work Contract

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/BASE_RULES_VERSION.md"
      - "docs/operations/BS-OPS-20260825-08_SESSION_HANDOFF_CORE_SIMPLIFICATION.md"
      - "docs/planning/BLACKSMITH_PLANNING_AUTHORITY_INDEX.md"
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "docs/operations/BLACKSMITH_BASE_CURRENT_ADAPTATION_WORK_CONTRACT_20260901.md"
      - "docs/operations/receipts/2026-09-01-base-current-adaptation-work-contract.json"
      - "docs/operations/receipts/2026-09-02-pm-execution-gate.json"
      - "tools/check_pm_work_receipt.py"
      - "tests/test_pm_execution_gate.py"
      - "tests/test_pm_real_base_integration.py"
      - "tests/check_base_current_adaptation_work_contract.py"
      - ".github/workflows/validate-current-base-adaptation-work-contract.yml"
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Independently fresh-read Blacksmith source/main SHA"
        required: true
        type: string
      expected_subject_head_sha:
        description: "Independently fresh-read Blacksmith verification subject HEAD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Blacksmith PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_subject_head_sha }}
          path: project
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out observed Base receipt validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alsdmlals4-eng/Base
          ref: 19355b7ef065a21d0f2b685c7d9be64a4a3970f8
          path: base-observed
          persist-credentials: false
          show-progress: false
      - name: Check out merged Base PM validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alsdmlals4-eng/Base
          ref: 96bee2700c8931b9262ad5a24a0664a400858f20
          path: base-pm
          persist-credentials: false
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install merged Base PM validator dependencies
        run: python -m pip install -r base-pm/.github/validation-requirements.txt
      - name: Validate current Base adaptation contract and receipt
        working-directory: project
        env:
          BLACKSMITH_BASE_ROOT: ../base-observed
        run: python tests/check_base_current_adaptation_work_contract.py
      - name: Test PM wrapper boundaries
        working-directory: project
        run: python -m unittest tests.test_pm_execution_gate -v
      - name: Test actual Base PM integration
        working-directory: project
        env:
          BS_BASE_PM_ROOT: ../base-pm
          BS_PM_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_source_sha }}
          BS_PM_EXPECTED_SUBJECT_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_subject_head_sha }}
        run: python -m unittest tests.test_pm_real_base_integration -v
