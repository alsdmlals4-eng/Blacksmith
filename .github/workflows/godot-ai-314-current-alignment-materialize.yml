name: Materialize Godot AI 3.1.4 current alignment

on:
  push:
    branches:
      - chore/godot-ai-314-current-alignment

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/godot-ai-314-current-alignment
          fetch-depth: 0

      - name: Patch current routers fail-closed
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one literal match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_insert_once(path: Path, pattern: str, addition: str) -> None:
              text = path.read_text(encoding='utf-8')
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, found {len(matches)}')
              match = matches[0]
              text = text[:match.end()] + addition + text[match.end():]
              path.write_text(text, encoding='utf-8')

          gates = Path('[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md')
          replace_once(
              gates,
              'TOOLCHAIN_ACTIVATION_DECISION: BS-TOOLCHAIN-20260809-01\nGODOT_AI_VERSION: 3.1.3',
              'TOOLCHAIN_ACTIVATION_DECISION: BS-TOOLCHAIN-20260809-01\nTOOLCHAIN_CURRENT_VERSION_DECISION: BS-TOOLCHAIN-20260811-02\nGODOT_AI_VERSION: 3.1.4',
          )
          replace_once(
              gates,
              '`GODOT_AI_VERSION: 3.1.3`은 현재 저장소에 실제 반영된 toolchain 상태를 기록한다. 사용자가 알려준 upstream `3.1.4` 업데이트는 별도 toolchain Decision/검증 전까지 이 콘텐츠 Decision에서 자동 승격하지 않는다.',
              '`BS-TOOLCHAIN-20260811-02`에 따라 현재 저장소의 Godot AI vendor는 공식 upstream `v3.1.4`와 exact tree 정합 상태다. `BS-TOOLCHAIN-20260809-01`과 Task2의 `3.1.3` 실행 증거는 역사로 보존하며, 완료된 Task2 전용 `set_main_scene` vendor overlay는 current upstream-exact vendor에서 재도입하지 않는다. 미래 main-scene 영속 변경은 새 범위 Decision이 필요하다.',
          )

          current = Path('CURRENT_CONFIRMED_DECISIONS.md')
          replace_once(
              current,
              'HIGODOT_PRODUCTION_EXECUTION_PATH: PROVEN_TASK2_COMPLETED\nR3_R7_DESIGN_STATE:',
              'HIGODOT_PRODUCTION_EXECUTION_PATH: PROVEN_TASK2_COMPLETED\nTOOLCHAIN_CURRENT_VERSION_DECISION: BS-TOOLCHAIN-20260811-02\nGODOT_AI_CURRENT_VERSION: 3.1.4\nR3_R7_DESIGN_STATE:',
          )
          regex_insert_once(
              current,
              r'^- `BS-TOOLCHAIN-20260809-01`:[^\n]*\n',
              '- `BS-TOOLCHAIN-20260811-02`: 현재 Godot AI vendor를 공식 `v3.1.4` exact upstream tree로 승격한다. Task2의 실제 `3.1.3` 실행·PROVE·PUBLISH 증거는 역사로 유지하고, Task2 전용 `set_main_scene` vendor overlay는 현재 vendor에서 재도입하지 않는다. GUT 9.7.1·Hera 비권위 상태·HiGodot scoped authoring authority·제품/Task3 차단은 변경하지 않는다. — `USER_APPROVED / CURRENT_VENDOR_3_1_4 / EXACT_UPSTREAM_V3_1_4 / PRODUCT_BLOCKED / TASK3_NOT_APPROVED`\n',
          )

          agents = Path('AGENTS.md')
          regex_insert_once(
              agents,
              r'^`BS-TOOLCHAIN-20260809-01`:[^\n]*\n',
              '\n`BS-TOOLCHAIN-20260811-02`: 사용자의 최신 3.1.4 업데이트 승인을 current version authority로 적용한다. 현재 `addons/godot_ai`는 공식 `v3.1.4` exact upstream vendor이며, `BS-TOOLCHAIN-20260809-01`의 3.1.3은 GUT/Hera 활성화와 Task2 실행의 역사 baseline으로 남는다. 완료된 Task2 전용 `set_main_scene` vendor overlay는 current vendor에 재포크하지 않으며 미래 영속 main-scene 변경은 새 범위 Decision이 필요하다. GUT 9.7.1 sole test authority, Hera authority `NONE`, 제품/Task3 차단은 그대로다.\n',
          )

          health = Path('docs/PROJECT_OPERATING_HEALTH.json')
          payload = json.loads(health.read_text(encoding='utf-8'))
          record = next(item for item in payload['evidence']['operating'] if item['id'] == 'BS-CURRENT-DECISIONS')
          record['sha256'] = hashlib.sha256(current.read_bytes()).hexdigest()
          health.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/godot-ai-314-current-alignment-materialize.yml').unlink()
          PY

      - name: Commit materialized current state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md CURRENT_CONFIRMED_DECISIONS.md docs/PROJECT_OPERATING_HEALTH.json '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md' .github/workflows/godot-ai-314-current-alignment-materialize.yml
          git diff --cached --check
          git commit -m 'docs: materialize Godot AI 3.1.4 current authority'
          git push origin HEAD:chore/godot-ai-314-current-alignment
