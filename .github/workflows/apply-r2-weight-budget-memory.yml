name: Apply R2 Weight Budget Memory Canon

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - tools/apply_r2_weight_budget_memory.py
      - .github/workflows/apply-r2-weight-budget-memory.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply canon synchronization
        run: python tools/apply_r2_weight_budget_memory.py
      - name: Repair current validation assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mobile_path = Path("tests/test_r2_mobile_customer_card_progressive_disclosure.py")
          mobile = mobile_path.read_text(encoding="utf-8")
          old = 'self.assertIn("현재 승인 카운터: `5/10`", active)'
          new = 'self.assertIn("현재 승인 카운터: `6/10`", active)'
          if old not in mobile and new not in mobile:
              raise SystemExit("mobile current counter assertion not found")
          mobile_path.write_text(mobile.replace(old, new), encoding="utf-8")

          core_path = Path("tests/check_project_core_alignment.py")
          core = core_path.read_text(encoding="utf-8")
          for relative in (
              "[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md",
              "[기획서]/00_프로젝트_허브/DOCUMENTATION_MAP.md",
          ):
              pattern = re.compile(
                  rf'(\"{re.escape(relative)}\": \(.*?\")R2_BATCH_005_5_OF_10(\")',
                  re.S,
              )
              core, count = pattern.subn(r'\1R2_BATCH_005_6_OF_10\2', core, count=1)
              if count != 1 and "R2_BATCH_005_6_OF_10" not in core:
                  raise SystemExit(f"core current token not repaired for {relative}")
          core_path.write_text(core, encoding="utf-8")
          PY
      - name: Run focused contracts
        run: >-
          python -m unittest
          tests.test_base_v942_planning_first_adoption
          tests.test_r2_artistry_generation_growth_economy
          tests.test_r2_customer_equipment_compatibility
          tests.test_r2_mobile_customer_card_progressive_disclosure
          tests.test_r2_enhancement_dominant_simple_load_gate
          tests.test_r2_equipment_base_weight_points
          tests.test_r2_weight_performance_budget_and_lightweight_tradeoff
          -v
      - name: Run project core alignment
        run: python tests/check_project_core_alignment.py
      - name: Remove one-shot files
        run: rm tools/apply_r2_weight_budget_memory.py .github/workflows/apply-r2-weight-budget-memory.yml
      - name: Commit and push synchronized canon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: canonize weight budget memory and precision opportunity cost"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
