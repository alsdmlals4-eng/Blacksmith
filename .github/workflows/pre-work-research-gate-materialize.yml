name: Materialize approved pre-work research gate

on:
  push:
    branches:
      - docs/pre-work-research-gate
    paths:
      - .github/workflows/pre-work-research-gate-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pre-work-research-gate
          fetch-depth: 0
      - name: Materialize approved canon
        run: python tools/_materialize_pre_work_research_gate.py
      - name: Commit materialized canon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: materialize pre-work research gate'
          git push origin HEAD:docs/pre-work-research-gate
