name: Validate Blacksmith BCA Adoption

on:
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "skills/**"
      - "[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json"
      - "tests/test_bca_visual_sheet_adoption.py"
      - "tests/test_bca_workflow_contract.py"
      - ".github/workflows/validate-bca-visual-sheet-adoption.yml"

permissions:
  contents: read

jobs:
  contract:
    name: BCA visual Sheet adoption contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run BCA contracts
        run: >-
          python -m unittest
          tests.test_bca_visual_sheet_adoption
          tests.test_bca_workflow_contract
          -v
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
