name: Validate Durability Repair Model

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CURRENT_CONFIRMED_DECISIONS_20260820_OVERLAY.md'
      - 'docs/decisions/BS-REPAIR-20260826-29_DURABILITY_REPAIR_SCAR_MODEL.md'
      - 'docs/planning/BLACKSMITH_DURABILITY_REPAIR_MODEL_20260826.json'
      - 'docs/planning/BLACKSMITH_CORE_SIMPLIFICATION_CANON_20260825.md'
      - 'docs/planning/BLACKSMITH_PLANNING_AUTHORITY_INDEX.md'
      - 'docs/operations/BS-OPS-20260825-08_SESSION_HANDOFF_CORE_SIMPLIFICATION.md'
      - 'tests/check_durability_repair_model_current_contract.py'
      - '.github/workflows/validate-durability-repair-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current durability repair authority
        run: python tests/check_durability_repair_model_current_contract.py
