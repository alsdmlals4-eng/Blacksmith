name: Repair Phase C Development Gates

on:
  push:
    branches:
      - ops/blacksmith-dedicated-local-executor-bootstrap
    paths:
      - .github/workflows/_repair-phase-c-development-gates.yml
      - tools/_repair_phase_c_development_gates.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/blacksmith-dedicated-local-executor-bootstrap
          fetch-depth: 0
      - name: Repair current Development Gates
        run: python tools/_repair_phase_c_development_gates.py
      - name: Remove one-shot repair helpers
        run: |
          rm tools/_repair_phase_c_development_gates.py
          rm .github/workflows/_repair-phase-c-development-gates.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: align current development gates with Phase C entry"
          git push origin HEAD:ops/blacksmith-dedicated-local-executor-bootstrap
