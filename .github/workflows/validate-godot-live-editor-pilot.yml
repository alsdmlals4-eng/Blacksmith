name: Validate Godot Live-Editor Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - .godot-live-editor/project-pilot.json
      - docs/GODOT_LIVE_EDITOR_ADOPTION.md
      - tests/test_godot_live_editor_adoption.py
      - .github/workflows/validate-godot-live-editor-pilot.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adoption-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - run: python -m pytest tests/test_godot_live_editor_adoption.py -q

  project-pilot:
    needs: adoption-contract
    uses: alsdmlals4-eng/Base/.github/workflows/reusable-godot-project-pilot.yml@2b595570bd237174b2b962a1eb54588b5ecc508d
    with:
      base_pilot_commit: 2b595570bd237174b2b962a1eb54588b5ecc508d
      descriptor_path: .godot-live-editor/project-pilot.json
      artifact_retention_days: 14

  pilot-failure-diagnostics:
    needs: project-pilot
    if: ${{ always() && needs.project-pilot.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: godot-project-pilot-${{ github.repository_id }}-${{ github.sha }}
          path: .godot-live-editor/pilot-failure
      - name: Surface bounded Pilot failure marker
        shell: bash
        run: |
          set -euo pipefail
          test -f .godot-live-editor/pilot-failure/failure.json
          cat .godot-live-editor/pilot-failure/failure.json
