name: Validate HiGodot GUT Authority Gate

on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - "[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md"
      - docs/planning/BLACKSMITH_HIGODOT_GUT_AUTHORITY_AND_ENTRY_GATE_SPEC_2026-08-06.md
      - docs/testing/HIGODOT_GUT_AUTHORITY_POLICY.json
      - docs/operations/BLACKSMITH_ENTRY_GATE_SNAPSHOT_2026-08-06.json
      - tests/test_higodot_gut_authority_gate.py
      - .github/workflows/validate-higodot-gut-authority-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-entry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - run: python -m pytest tests/test_higodot_gut_authority_gate.py -q
