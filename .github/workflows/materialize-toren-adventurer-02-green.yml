name: Materialize Toren Adventurer 02 GREEN

on:
  push:
    branches:
      - agent/r3-toren-adventurer-02-design
    paths:
      - ".github/workflows/materialize-toren-adventurer-02-green.yml"

permissions:
  contents: write

jobs:
  green:
    if: github.repository == 'alsdmlals4-eng/Blacksmith'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r3-toren-adventurer-02-design
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Materialize approved planning canon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          spec_path = root / 'docs/superpowers/specs/2026-08-11-adventurer-02-toren-long-range-reliability-design.md'
          canon_path = root / 'docs/planning/BLACKSMITH_R3_ADVENTURER_02_TOREN_MARCH_LONG_RANGE_RELIABILITY_CANON_2026.md'
          registry_path = root / 'docs/planning/CURRENT_R3_R7_CANON_REGISTRY.json'
