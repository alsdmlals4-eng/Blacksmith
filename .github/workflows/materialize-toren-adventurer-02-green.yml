          health_path = root / 'docs/PROJECT_OPERATING_HEALTH.json'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor missing: {old[:120]}')
              return text.replace(old, new, 1)

          # Canon: approved spec is the content source; only role/status heading changes.
          spec = spec_path.read_text(encoding='utf-8')
          canon = replace_once(
              spec,
              '# Blacksmith R3–R7 ADVENTURER_02 — 토렌 마치 장거리 여정 신뢰성 설계',
              '# Blacksmith R3–R7 ADVENTURER_02 — 토렌 마치 장거리 여정 지속성·신뢰성 정본',
              'canon title',
