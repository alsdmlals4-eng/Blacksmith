name: Materialize Nadia detail GREEN

on:
  push:
    branches:
      - agent/r3-nadia-information-result-detail
    paths:
      - ".github/workflows/materialize-nadia-detail-green.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'alsdmlals4-eng/Blacksmith'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r3-nadia-information-result-detail
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply same-decision canon refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          main142 = '13f878589b4849defb97d2c4509e7bf50bcb507d'

          current_path = root / 'CURRENT_CONFIRMED_DECISIONS.md'
          current = current_path.read_text(encoding='utf-8')
          old = '`USER_APPROVED / R3_R7_1_OF_10 / PENDING_MERGE / PLANNING_ONLY`'
          new = '`USER_APPROVED / R3_R7_1_OF_10 / MERGED_PR142_MAIN_CANON / PLANNING_ONLY`'
          if old not in current:
              raise SystemExit('expected Nadia pending status missing from CURRENT_CONFIRMED_DECISIONS.md')
          current = current.replace(old, new, 1)
          current_path.write_text(current.rstrip() + '\n', encoding='utf-8')

          roadmap_path = root / '[기획서]/00_프로젝트_허브/ROADMAP.md'
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old = 'CURRENT_STAGE_STATUS: R3_R7_1_OF_10_PENDING_MERGE'
          new = 'CURRENT_STAGE_STATUS: R3_R7_1_OF_10_MERGED_PR142_MAIN_CANON'
          if old not in roadmap:
              raise SystemExit('expected pending stage status missing from ROADMAP.md')
          roadmap = roadmap.replace(old, new, 1)
          roadmap_path.write_text(roadmap.rstrip() + '\n', encoding='utf-8')

          registry_path = root / 'docs/planning/CURRENT_R3_R7_CANON_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          decision = next(item for item in registry['current_decisions'] if item['id'] == 'BS-CONTENT-20260811-01')
          decision['status'] = 'USER_APPROVED_R3_R7_1_OF_10_MERGED_PR142_MAIN_CANON'
          contract = decision['contract']
          contract['customer_information_layers'] = [
              'DEFAULT_CUSTOMER_CARD',
              'POST_EQUIPMENT_DECISION_LAYER',
              'DETAIL_VIEW',
          ]
          contract['reason_priority'] = 'LOAD_GATE_THEN_ENHANCEMENT_THEN_RELEVANT_UTILITY_THEN_SMALL_CUSTOMER_CONTEXT'
          contract['result_information_hierarchy'] = 'THREE_STATE_SUMMARY_TWO_TO_FOUR_REASONS_ONE_PRIMARY_NEXT_ACTION'
          contract['test_fixture_status'] = 'NON_CANONICAL_BASELINE_TEST_FIXTURE'
          contract['playtest_evidence'] = 'OBSERVED_BEHAVIOR_PLUS_NEUTRAL_RECALL'
          contract['auto_recommended_best_item'] = False
          contract['minimum_touch_target'] = '48dp'
          contract['same_uid_visible_in_result'] = True
          contract['approved_main'] = main142
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          canon_path = root / 'docs/planning/BLACKSMITH_R3_ADVENTURER_01_NADIA_VENN_RUINS_SURVIVAL_RECOVERY_CANON_2026.md'
          canon = canon_path.read_text(encoding='utf-8')
          old = '- 상태: `USER_APPROVED / R3_R7_1_OF_10 / PENDING_MERGE`'
          new = '- 상태: `USER_APPROVED / R3_R7_1_OF_10 / MERGED_PR142_MAIN_CANON`\n- 승인 main: `13f878589b4849defb97d2c4509e7bf50bcb507d`'
          if old not in canon:
              raise SystemExit('expected pending status missing from Nadia canon')
          canon = canon.replace(old, new, 1)

          s9 = canon.index('## 9. 모바일 정보 공개')
          s10 = canon.index('## 10. 플레이테스트 가설')
          section9 = '''## 9. 모바일 정보 공개 — 나디아 상세 계약\n\n이 상세화는 `BS-UX-20260805-01`의 3단계 구조를 Nadia 콘텐츠에 그대로 적용한다. 새 고객 UI 시스템을 만들지 않는다.\n\n```text\nDEFAULT_CUSTOMER_CARD\n→ POST_EQUIPMENT_DECISION_LAYER\n→ DETAIL_VIEW\n```\n\n### 9.1 기본 고객 카드 — `DEFAULT_CUSTOMER_CARD`\n\n항상 보이는 정보는 인계 판단에 직접 필요한 것만 둔다.\n\n- `NADIA_VENN / 나디아 벤`과 `유적 탐사대장` 역할\n- 현재 목적: `유적 탐사 — 생환 + 회수`\n- 알려진 사건 위험도 `1~10`\n- 근력·기량·체력·판단력 `1~10`\n- 현재 탐사와 실제로 관련된 주·보조 적성만\n- 현재 선택 작품이 없을 때도 명확한 주 행동 `작품 선택`\n\n전체 적성 행렬, 내부 보정식, 숨은 위험 경고, 아직 발생하지 않은 결과 스포일러는 기본 카드에 펼치지 않는다. 핵심 상호작용 목표는 최소 `48dp`이며 색상·호버·길게 누르기만으로 상태나 행동을 전달하지 않는다.\n\n### 9.2 작품 선택 후 판단층 — `POST_EQUIPMENT_DECISION_LAYER`\n\n작품을 고르면 같은 판단 맥락에서 다음 정보를 갱신한다.\n\n```text\nLOAD_GATE_THEN_ENHANCEMENT_THEN_RELEVANT_UTILITY_THEN_SMALL_CUSTOMER_CONTEXT\n```\n\n우선순위는 다음과 같다.\n\n1. **배정 가능 여부** — `WITHIN_LIMIT / OVERWEIGHT`, 현재 중량 / 최대 중량\n2. **강화 단계** — 일반 사건 성공률의 주효과\n3. **실제 관련 환경·유틸리티 적합** — 현재 유적 상황에 연결되는 승인 기능만\n4. **고객 능력·적성 맥락** — 강화보다 작은 보조 원인\n\n`OVERWEIGHT이면 예상 성공률보다 배정 불가를 우선한다`. 중량 초과 작품에는 행동 가능한 성공률을 강조하지 않고 `배정 불가 / 중량 초과`와 원인을 먼저 보여준다. 한도 이내 작품은 기존 공개 계약에 따라 `약 N%`와 선택 전후 방향을 보여주고, 핵심 원인 `2~4개`를 함께 표시한다.\n\n- 선택 작품의 이름·같은 UID 식별자·강화 단계·중량을 확인할 수 있다.\n- 실제 관련 기능이 없으면 기능 적합 칸을 억지로 채우지 않는다.\n- `자동 추천·Best 배지 금지`. 하나의 녹색 정답·자동 추천·불투명 종합점수로 선택을 대신하지 않는다.\n- `이 작품을 맡긴다`가 주 행동이며 `OVERWEIGHT`에서는 비활성 이유를 텍스트로 설명한다.\n- `다른 작품 보기`로 교체할 수 있지만 기본 화면에 전체 작품 비교 행렬을 강제하지 않는다.\n\n### 9.3 상세 보기 — `DETAIL_VIEW`\n\n한 개의 명확한 상세 진입점에서만 다음을 확장한다.\n\n- 현재 판단에 관련된 전체 능력·적성\n- 현재 중량 / 최대 중량\n- 선택 작품의 실제 적용 기능과 활성 조건\n- 공개 가능한 예상 성공률 원인\n- 작품 UID·제작 provenance·관련 생애 기록\n\n내부 RNG 식, 숨은 사건 전개, 미래 결과는 공개하지 않는다. 상세에서 돌아오면 선택 작품과 현재 판단 맥락을 유지한다.\n\n### 9.4 결과 화면 정보 계층\n\n결과는 내부적으로 세 축을 유지하지만 첫 화면을 세 개의 상세 보고서로 만들지 않는다.\n\n```text\nTHREE_STATE_SUMMARY_TWO_TO_FOUR_REASONS_ONE_PRIMARY_NEXT_ACTION\n```\n\n기본 결과 화면 순서:\n\n1. `나디아 귀환` — `SAFE_RETURN / FORCED_RETREAT`\n2. `회수` — `RECOVERED / PARTIAL_RECOVERY / ABANDONED`\n3. `작품 상태` — 같은 UID와 `RETURNED_WITH_TRACES / DAMAGED_UID_PRESERVED / MAJOR_DAMAGED_UID_PRESERVED / LOST_PENDING_RECOVERY / RECOVERED_SAME_UID` 중 현재 상태\n4. 핵심 인과 원인 `2~4개`\n5. 현재 상태에 맞는 **주 다음 행동 하나** — 복원, 후속 강화, 회수 단서 확인, 또는 새 제작 이유 중 해당하는 것\n\n같은 UID임을 결과 상단에서 분명히 보이게 하고, 연대기 세부·전체 원인·소유/손상 이력은 하나의 상세 진입점으로 보낸다. 결과 화면에서 성공/실패 하나의 총점이나 자동 다음 행동을 강요하지 않는다.\n\n'''
          canon = canon[:s9] + section9 + canon[s10:]

          s10 = canon.index('## 10. 플레이테스트 가설')
          s11 = canon.index('## 11. 인터넷 벤치마킹')
          section10 = '''## 10. 비정본 테스트 프리셋·플레이테스트 계약\n\n이 Decision은 제품 구현 승인이 아니다. 아래 숫자·fixture는 밸런스 정본이 아니라 선택 구조를 검증하기 위한 폐기 가능한 시험 입력이다.\n\n```yaml\nfixture_status: NON_CANONICAL_BASELINE_TEST_FIXTURE\ncanonical_balance: false\nproduct_data_authority: NONE\nplaytest_evidence: OBSERVED_BEHAVIOR_PLUS_NEUTRAL_RECALL\n```\n\n### 10.1 비정본 fixture 후보\n\n한 번의 테스트 세션에서 최소 세 작품 후보가 서로 다른 이유를 갖도록 구성한다.\n\n- `FIXTURE_A_HIGH_ENHANCEMENT_HEAVY`: 강화가 높지만 현재 테스트 프로필에서는 중량 Gate를 넘길 수 있는 작품\n- `FIXTURE_B_BALANCED_WITHIN_LOAD`: 중간 강화·중량 한도 이내의 일반 후보\n- `FIXTURE_C_CONTEXT_UTILITY`: 강화는 더 낮을 수 있지만 현재 유적 상황과 실제로 연결되는 승인 유틸리티를 가진 후보\n\n실제 승인 기능을 확정하지 못한 fixture에서는 새 기능명을 만들지 않고 `APPROVED_RELEVANT_UTILITY_PLACEHOLDER`를 사용한다. 이 토큰은 제품 기능이 아니라 **현재 정본에서 승인된 실제 관련 유틸리티를 테스트 준비 시 대입하라는 자리표시자**다.\n\n사건 위험도·나디아 능력치·정확한 예상 성공률·보상·손상·복구 비용은 테스트 세션별 `BASELINE_TEST_PRESET`으로 기록하며 제품 정본으로 승격하지 않는다. 예상 성공률 표시는 기존 `약 N% / 10% 단위 / 5~95%` 공개 계약을 따른다.\n\n### 10.2 행동 관찰\n\n다음 행동을 실제 화면 조작에서 관찰한다.\n\n1. 인계 전에 서로 다른 작품을 최소 두 개 이상 비교하는가.\n2. 강화 숫자 외에 중량 또는 실제 관련 환경·유틸리티 근거를 한 번 이상 확인하는가.\n3. `약 N%`를 확정 성공으로 취급하지 않는가.\n4. `OVERWEIGHT`를 높은 강화보다 우선하는 배정 불가 Gate로 이해하는가.\n5. 결과 뒤 같은 UID의 작품을 알아보고 복원·후속 강화·보존·새 제작 중 다음 행동을 고민하는가.\n6. 여러 작품을 오갈 때 반복 탭·뒤로가기가 과도해지는지 기록하되, 이 관찰만으로 즉시 전체 비교 행렬을 추가하지 않는다.\n\n### 10.3 중립적 회상 질문\n\n- “어떤 작품을 맡겼나요?”\n- “결정할 때 무엇을 봤나요?”\n- “결과에 가장 영향을 준 것은 무엇이라고 생각하나요?”\n- “돌아온 작품은 이전 작품과 어떤 관계인가요?”\n- “다음에 무엇을 하고 싶나요? 왜인가요?”\n\n질문에서 정답 원인이나 기대 행동을 먼저 말하지 않는다. 만족도·`재미있었나요?` 하나만으로 PASS하지 않는다. 관찰 행동과 회상이 충돌하면 이해·인과 PASS를 보류한다.\n\n### 10.4 판정 Gate\n\n```text\nOBSERVED_BEHAVIOR_PLUS_NEUTRAL_RECALL\n→ KEEP / CHANGE / RETEST\n```\n\n- 여러 플레이어가 자동으로 최고 강화만 고르면 `CHANGE / RETEST`.\n- 중량 Gate를 성공률보다 하위 정보로 해석하면 `CHANGE`.\n- 결과 3축을 구분하지 못하거나 같은 UID를 새 작품으로 오해하면 `CHANGE / RETEST`.\n- 정확한 수치 조정은 구조 이해가 확보된 뒤 별도 테스트 프리셋에서 수행한다.\n\n'''
          canon = canon[:s10] + section10 + canon[s11:]

          insert_at = canon.index('## 12. 적대적 검토')
          support = '''### 11.4 Android 접근성·터치 목표\n\n```yaml\nsource_domain: ANDROID_DEVELOPERS_ACCESSIBILITY\nsource_role: PROFESSIONAL_PRACTICE_OFFICIAL\nobserved_fact: 모바일 상호작용은 충분한 터치 목표를 제공하고 핵심 행동을 숨은 제스처에만 의존시키지 않는 것이 권장된다.\njudgment: ADOPT_AS_SUPPORT\napply_to_blacksmith: 기존 `48dp` 계약과 명시적 작품 선택·상세 진입점을 유지한다.\ndo_not_copy: 플랫폼 일반 규칙을 이유로 Blacksmith 정보 계층을 확장하거나 별도 UI 시스템을 만들지 않는다.\n```\n\n### 11.5 Xbox 접근성 — UI context·readability\n\n```yaml\nsource_domain: XBOX_ACCESSIBILITY_GUIDELINES\nsource_role: PROFESSIONAL_PRACTICE_OFFICIAL\nobserved_fact: 사용자가 화면 목적, 요소 기능, 상호작용 결과를 이해할 수 있는 맥락과 읽기 쉬운 UI가 중요하다.\njudgment: ADAPT\napply_to_blacksmith: `배정 가능 여부 → 강화 → 관련 기능 → 고객 맥락`의 이유 순서와 결과의 다음 행동을 텍스트로 설명한다.\ndo_not_copy: 자동 추천·Best 표식으로 판단 자체를 대신하지 않는다.\n```\n\n'''
          canon = canon[:insert_at] + support + canon[insert_at:]

          old14 = '''- 나디아 고객 카드의 정보 계층 초안\n- 결과 화면의 귀환·회수·작품 상태 정보 계층\n- 테스트 프리셋 후보값의 **비정본** fixture 설계\n- 행동 관찰 체크리스트와 중립적 회상 질문\n'''
          new14 = '''위 네 상세화 항목은 이 same-ID refinement에서 완료했다. 다음 반복에서는 실제 playable scope가 승인된 뒤 **비정본 fixture를 실행해 관찰·회상 증거를 수집**하거나, 별도 프로젝트 방향 Decision이 필요한 항목으로 이동한다.\n'''
          if old14 not in canon:
              raise SystemExit('expected section 14 detail list missing')
          canon = canon.replace(old14, new14, 1)
          canon_path.write_text(canon.rstrip() + '\n', encoding='utf-8')

          test_path = root / 'tests/test_r3_adventurer_01_nadia_content.py'
          test = test_path.read_text(encoding='utf-8')
          old = '        self.assertNotIn("BS-CONTENT-20260811-01`:", current.split("PENDING_MERGE")[0] if "PENDING_MERGE" in current else "")\n'
          new = '        self.assertNotIn("USER_APPROVED / R3_R7_1_OF_10 / PENDING_MERGE / PLANNING_ONLY", current)\n'
          if old not in test:
              raise SystemExit('expected targeted test line missing')
          test = test.replace(old, new, 1)
          test_path.write_text(test.rstrip() + '\n', encoding='utf-8')

          spec = root / 'docs/superpowers/specs/2026-08-11-adventurer-01-nadia-information-result-playtest-design.md'
          spec.parent.mkdir(parents=True, exist_ok=True)
