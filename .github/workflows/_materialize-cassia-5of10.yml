name: Materialize Cassia R3 5 of 10

on:
  push:
    branches:
      - plan/r3-gladiator-01-cassia-5of10
    paths:
      - tools/_materialize_cassia_5of10.py
      - .github/workflows/_materialize-cassia-5of10.yml

permissions:
  contents: write

concurrency:
  group: materialize-cassia-r3-5of10
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved planning canon
        run: python tools/_materialize_cassia_5of10.py
      - name: Verify focused current contracts before commit
        run: |
          python -m unittest tests.test_r3_gladiator_01_cassia_content -v
          python -m unittest tests.test_r3_collector_01_ersa_content -v
          python -m unittest tests.test_r3_soldier_01_marek_content -v
          python tests/check_project_core_alignment_current.py
      - name: Commit materialized planning state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No materialized changes'; exit 1; }
          git commit -m 'docs: materialize Cassia gladiator 5 of 10 canon'
          git push origin HEAD:${GITHUB_REF_NAME}
