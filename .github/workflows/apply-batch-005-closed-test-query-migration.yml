name: Apply Batch 005 Closed Test Query Migration

on:
  push:
    branches:
      - agent/r2-checkpoint-005-postmerge-closure
    paths:
      - "tools/migrate_batch_005_closed_test_queries.py"
      - ".github/workflows/apply-batch-005-closed-test-query-migration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-checkpoint-005-postmerge-closure
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python tools/migrate_batch_005_closed_test_queries.py
      - name: Commit migrated test queries
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No test query migration required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_base_v942_planning_first_adoption.py tests/test_r2_*.py
          git commit -m "test: query closed Batch 005 evidence"
          git push origin HEAD:agent/r2-checkpoint-005-postmerge-closure
