name: Validate Customer Event And Visual Consumer

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CURRENT_CONFIRMED_DECISIONS_20260820_OVERLAY.md'
      - 'docs/decisions/BS-DAMAGE-20260826-30_CUSTOMER_WORLD_EVENT_DAMAGE_POLICY.md'
      - 'docs/decisions/BS-ART-20260826-04_ACTUAL_GAME_IMAGE_CONSUMER_GATE.md'
      - 'docs/planning/BLACKSMITH_CUSTOMER_WORLD_EVENT_DAMAGE_POLICY_20260826.json'
      - 'docs/planning/BLACKSMITH_ACTUAL_GAME_IMAGE_CONSUMER_GATE_20260826.json'
      - 'docs/planning/BLACKSMITH_CORE_SIMPLIFICATION_CANON_20260825.md'
      - 'docs/planning/BLACKSMITH_PLANNING_AUTHORITY_INDEX.md'
      - 'docs/planning/BLACKSMITH_ART_DIRECTION_REWORK_DECISION_20260825.md'
      - 'docs/planning/BLACKSMITH_VISUAL_GDD_ASSET_APPROVAL_2026-08-25.md'
      - 'docs/operations/BS-OPS-20260825-08_SESSION_HANDOFF_CORE_SIMPLIFICATION.md'
      - 'tests/check_customer_world_event_damage_policy_current_contract.py'
      - 'tests/check_actual_game_visual_consumer_gate_current_contract.py'
      - '.github/workflows/validate-customer-world-event-and-visual-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate customer world event damage policy
        run: python tests/check_customer_world_event_damage_policy_current_contract.py
      - name: Validate actual game visual consumer gate
        run: python tests/check_actual_game_visual_consumer_gate_current_contract.py
