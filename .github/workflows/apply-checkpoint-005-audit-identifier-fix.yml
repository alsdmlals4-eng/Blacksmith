name: Apply Checkpoint 005 Audit Identifier Fix

on:
  push:
    branches:
      - agent/r2-checkpoint-005-postmerge-closure
    paths:
      - "tools/fix_checkpoint_005_audit_identifier.py"
      - ".github/workflows/apply-checkpoint-005-audit-identifier-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-checkpoint-005-postmerge-closure
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: |
          python tools/fix_checkpoint_005_audit_identifier.py
          python -m py_compile tools/audit_project_operating_system.py
      - name: Commit identifier correction
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No identifier correction required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/audit_project_operating_system.py
          git commit -m "test: use canonical Checkpoint 005 audit identifier"
          git push origin HEAD:agent/r2-checkpoint-005-postmerge-closure
