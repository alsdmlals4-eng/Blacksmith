name: Decision08 adversarial repair once

on:
  push:
    branches:
      - docs/r3-collector-02-sedric-archival-accession

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/r3-collector-02-sedric-archival-accession
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair validated current-router conflicts
        run: python tools/decision08_adversarial_repair.py
      - name: Verify repaired current contracts
        run: |
          python -m unittest tests.test_r3_collector_02_sedric_content -v
          python tests/check_project_core_alignment_current.py
      - name: Preserve workflow for connector-owned deletion and remove helper
        run: |
          git checkout HEAD -- .github/workflows/decision08-adversarial-repair-once.yml
          rm tools/decision08_adversarial_repair.py
      - name: Commit adversarial repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: repair Decision08 current-router drift"
          git push origin HEAD:docs/r3-collector-02-sedric-archival-accession
