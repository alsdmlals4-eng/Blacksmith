name: One-shot R3 Noble 01 materializer

on:
  push:
    branches:
      - docs/r3-noble-01-heirloom-succession

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-decision06]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r3-noble-01-heirloom-succession
          fetch-depth: 0
      - name: Materialize Decision06 current authority
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          ROOT = Path('.')
          decision_id = 'BS-CONTENT-20260811-06'
          canon_path = 'docs/planning/BLACKSMITH_R3_NOBLE_01_CEREMONIAL_NOBLE_HEIRLOOM_SUCCESSION_RESTORATION_CANON_2026.md'

          registry_path = ROOT / 'docs/planning/CURRENT_R3_R7_CANON_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          registry['stage_status'] = 'R3_R7_DESIGN_ACTIVE'
          registry['product_implementation'] = 'BLOCKED'
          registry['task3_implementation'] = 'NOT_APPROVED'
          registry['next_approval_counter'] = '6/10'
          decisions = registry.setdefault('current_decisions', [])
          decisions = [d for d in decisions if d.get('id') != decision_id]
          decisions.append({
              'id': decision_id,
              'title': '귀족 01 의례 귀족 가보 계승 복원·유산 콘텐츠',
              'status': 'USER_APPROVED_R3_R7_6_OF_10',
              'canon': canon_path,
              'refines': ['BS-CONTENT-20260804-01', 'BS-CONTENT-20260804-02'],
              'depends_on': [
                  'BS-CUSTOMER-20260803-02',
                  'BS-CUSTOMER-20260805-01',
                  'BS-UX-20260805-01',
                  'BS-CRAFT-20260804-06',
                  'BS-CRAFT-20260805-01',
                  'BS-CRAFT-20260805-02',
                  'BS-CONTENT-20260811-04',
                  'BS-CONTENT-20260811-05',
              ],
              'contract': {
                  'content_id': 'NOBLE_01',
                  'customer_id': 'CEREMONIAL_NOBLE',
                  'customer_archetype': 'NOBLE',
                  'activity_family': 'HEIRLOOM_SUCCESSION_RESTORATION_AND_LEGACY',
                  'content_goal': 'PRESERVE_MEANINGFUL_HISTORY_WHILE_PREPARING_FOR_SUCCESSION',
                  'player_role': 'BLACKSMITH_HEIRLOOM_TREATMENT_DECISION_MAKER_NOT_HOUSE_OR_CEREMONY_CONTROLLER',
                  'existing_ceremonial_noble_representative_reused': True,
                  'new_named_noble_lore': False,
                  'same_item_uid_preserved': True,
                  'full_restoration_always_best': False,
                  'highest_artistry_always_best': False,
                  'opaque_house_prestige_or_authenticity_score': False,
                  'history_erasure_on_repair': False,
                  'restoration_count_artistry_growth': False,
                  'automatic_chronicle_affix_from_ceremony_or_restoration': False,
                  'restoration_farming_multiplier': False,
                  'direct_ceremony_minigame': False,
                  'noble_house_management': False,
                  'court_or_diplomacy_management': False,
                  'result_axes': [
                      'CEREMONY_READINESS_STATE',
                      'HEIRLOOM_TREATMENT_FIT_STATE',
                      'ITEM_UID_DYNASTIC_LEGACY_STATE',
                  ],
                  'immediate_feedback': 'THREE_STATE_SUMMARY_WITH_2_TO_4_CAUSAL_REASONS_AND_ONE_PRIMARY_NEXT_ACTION',
                  'exact_values': 'NON_CANONICAL_BASELINE_TEST_PRESET_USER_PLAYTEST_REQUIRED',
                  'product_implementation': 'BLOCKED',
                  'task3_implementation': 'NOT_APPROVED',
                  'human_playtest': 'NOT_RUN',
              },
          })
          registry['current_decisions'] = decisions
          benchmark = registry.setdefault('benchmark_context', [])
          if not any(x.get('decision_id') == decision_id for x in benchmark if isinstance(x, dict)):
              benchmark.extend([
                  {
                      'source': 'American Institute for Conservation Code of Ethics and Guidelines for Practice',
                      'decision_id': decision_id,
                      'decision': 'ADAPT',
                      'use': 'examine condition, compare intervention alternatives/risks, preserve treatment history',
                      'avoid': 'literal museum-conservation simulation',
                  },
                  {
                      'source': 'The Metropolitan Museum of Art ceremonial and presentation arms context',
                      'decision_id': decision_id,
                      'decision': 'ADAPT',
                      'use': 'ceremonial metalwork can carry social and dynastic meaning beyond combat power',
                      'avoid': 'prestige score as a universal value proxy',
                  },
                  {
                      'source': 'Blacksmith Master Steam product page',
                      'decision_id': decision_id,
                      'decision': 'REJECT',
                      'use': 'contrast benchmark',
                      'avoid': 'production-chain, staff, and shop-management expansion',
                  },
              ])
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          current_path = ROOT / 'CURRENT_CONFIRMED_DECISIONS.md'
          current = current_path.read_text(encoding='utf-8')
          current = current.replace(
              '> **R3_R7_DESIGN_ACTIVE / BS-CONTENT-20260811-05 / R3_R7_5_OF_10 / PLANNING_ONLY**',
              '> **R3_R7_DESIGN_ACTIVE / BS-CONTENT-20260811-06 / R3_R7_6_OF_10 / PLANNING_ONLY**',
              1,
          )
          current = current.replace('R3_R7_APPROVAL_COUNTER: 5/10', 'R3_R7_APPROVAL_COUNTER: 6/10', 1)
          current = current.replace('R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-05', 'R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-06', 1)
          bullet = ('- `BS-CONTENT-20260811-06`: `NOBLE_01` 의례 귀족 가보 계승 복원·유산 콘텐츠. 기존 `CEREMONIAL_NOBLE` 대표 ID와 같은 작품 UID의 실제 손상·수리·소유·계승·연대기 증거를 읽고, 계승 의식 전에 어디까지 수리·복원·재작업할지 판단한다. 최대 복원·최고 Artistry를 자동 정답으로 만들지 않고 가문 위신·진품성·계승 총점을 추가하지 않으며, 결과를 `CEREMONY_READINESS_STATE / HEIRLOOM_TREATMENT_FIT_STATE / ITEM_UID_DYNASTIC_LEGACY_STATE`로 분리한다. — `USER_APPROVED / R3_R7_6_OF_10 / PLANNING_ONLY`')
          if bullet not in current:
              lines = current.splitlines()
              insert_at = next(i + 1 for i, line in enumerate(lines) if line.startswith('- `BS-CONTENT-20260811-05`:'))
              lines.insert(insert_at, bullet)
              current = '\n'.join(lines) + '\n'
          section = '''\n## 23. R3–R7 여섯 번째 상세 콘텐츠 — 의례 귀족 가보 계승 복원·유산\n\nDecision: `BS-CONTENT-20260811-06`.\n\n```text\nNOBLE_01 / CEREMONIAL_NOBLE\nHEIRLOOM_SUCCESSION_RESTORATION_AND_LEGACY\nCEREMONY_READINESS_STATE / HEIRLOOM_TREATMENT_FIT_STATE / ITEM_UID_DYNASTIC_LEGACY_STATE\n```\n\n- 기존 `ceremonial_noble` 대표 fixture를 재사용하며 새 이름·가문 lore를 추가하지 않는다.\n- 같은 UID의 실제 상태·과거 수리·소유·계승·Chronicle provenance를 보고 개입 깊이를 판단한다.\n- 최대 복원·최고 Artistry는 보편적 자동 정답이 아니다.\n- 새 가문 위신·진품성·계승 총점을 만들지 않는다.\n- 수리·복원으로 물리 흔적이 바뀌어도 의미 있는 과거 생애 기록은 삭제하지 않는다.\n- 복원/의식 반복으로 Artistry 또는 Chronicle Affix를 자동 성장시키지 않는다.\n- 직접 의식·귀족 가문·궁정·외교 경영을 추가하지 않는다.\n- 책임 원본: `docs/planning/BLACKSMITH_R3_NOBLE_01_CEREMONIAL_NOBLE_HEIRLOOM_SUCCESSION_RESTORATION_CANON_2026.md`.\n- 제품 구현: `BLOCKED`.\n- Task3 구현: `NOT_APPROVED`.\n'''
          if '## 23. R3–R7 여섯 번째 상세 콘텐츠' not in current:
              current = current.rstrip() + '\n' + section
          current_path.write_text(current, encoding='utf-8')

          hub = ROOT / '[기획서]/00_프로젝트_허브'
          router_specs = {
              'ACTIVE_CONTEXT.md': [
                  ('R3_R7_APPROVAL_COUNTER: 5/10', 'R3_R7_APPROVAL_COUNTER: 6/10'),
                  ('R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-05', 'R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-06'),
                  ('현재 Decision은 `BS-CONTENT-20260811-05`', '현재 Decision은 `BS-CONTENT-20260811-06`'),
              ],
              'START_HERE.md': [
                  ('R3_R7_APPROVAL_COUNTER: 5/10', 'R3_R7_APPROVAL_COUNTER: 6/10'),
                  ('R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-05', 'R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-06'),
                  ('현재 연속 작업은 `BS-CONTENT-20260811-05`', '현재 연속 작업은 `BS-CONTENT-20260811-06`'),
              ],
              'ROADMAP.md': [
                  ('R3_R7_APPROVAL_COUNTER: 5/10', 'R3_R7_APPROVAL_COUNTER: 6/10'),
                  ('R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-05', 'R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-06'),
                  ('현재 승인 카운터: `5/10`.', '현재 승인 카운터: `6/10`.'),
              ],
              'DEVELOPMENT_GATES.md': [
                  ('R3_R7_APPROVAL_COUNTER: 5/10', 'R3_R7_APPROVAL_COUNTER: 6/10'),
                  ('R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-05', 'R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-06'),
                  ('Decision: `BS-CONTENT-20260811-05`.', 'Decision: `BS-CONTENT-20260811-06`.'),
              ],
          }
          router_note = '''\n\n<!-- BS-CONTENT-20260811-06 -->\n> `NOBLE_01_HEIRLOOM_SUCCESSION_RESTORATION_APPROVED`\n>\n> `R3_R7_DESIGN_ACTIVE`\n> `R3_R7_APPROVAL_COUNTER: 6/10`\n> `R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-06`\n> `PRODUCT_IMPLEMENTATION: BLOCKED`\n> `TASK3_IMPLEMENTATION: NOT_APPROVED`\n>\n> 기존 `CEREMONIAL_NOBLE`와 같은 작품 UID의 상태·수리·계승 이력을 바탕으로 계승 전 개입 깊이를 판단한다. 최대 복원·최고 Artistry·가문 위신/진품성 총점 자동 정답을 만들지 않으며, 직접 의식·가문·궁정·외교 경영을 추가하지 않는다.\n'''
          for name, replacements in router_specs.items():
              path = hub / name
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
              if 'NOBLE_01_HEIRLOOM_SUCCESSION_RESTORATION_APPROVED' not in text:
                  text = text.rstrip() + router_note + '\n'
              path.write_text(text, encoding='utf-8')

          workflow = ROOT / '.github/workflows/r3-noble-01-materialize.yml'
          if workflow.exists():
              workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: materialize Decision06 current canon [materialized-decision06]"
          git push origin HEAD:docs/r3-noble-01-heirloom-succession
