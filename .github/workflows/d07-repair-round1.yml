name: Apply Decision07 regression repair round 1

on:
  push:
    branches:
      - docs/r3-soldier-02-liana-mission-fit
    paths:
      - .github/workflows/d07-repair-round1.yml
      - tools/_d07_repair_round1.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/r3-soldier-02-liana-mission-fit
          fetch-depth: 0

      - name: Apply verified regression repairs
        run: python tools/_d07_repair_round1.py

      - name: Verify focused current contracts
        run: |
          python tests/check_project_core_alignment_current.py
          python -m unittest tests.test_r3_soldier_02_liana_content -v
          python -m unittest tests.test_project_adapter_long_lived_pr_baseline.LongLivedPrAdapterBaselineContractTests.test_current_decisions_health_evidence_hash_is_exact -v

      - name: Remove one-shot repair tools
        run: |
          rm tools/_d07_repair_round1.py
          rm .github/workflows/d07-repair-round1.yml

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: align Decision07 current consumers"
          git push origin HEAD:docs/r3-soldier-02-liana-mission-fit
