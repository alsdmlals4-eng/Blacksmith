name: Apply R2 Checkpoint 005 Main Canon

on:
  pull_request:
    types:
      - synchronize
    paths:
      - "tools/finalize_r2_checkpoint_005_main_canon.py"
      - ".github/workflows/apply-r2-checkpoint-005-main-canon.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/finalize-r2-checkpoint-005-main-canon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final authority transform
        run: python tools/finalize_r2_checkpoint_005_main_canon.py
      - name: Commit transformed authority files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No authority changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/planning/CURRENT_R2_CANON_REGISTRY.json \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/ROADMAP.md' \
            '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md'
          git commit -m "canon: finalize checkpoint 005 current authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
