name: Fix Toren Router Adversarial GREEN

on:
  push:
    branches:
      - agent/r3-toren-adventurer-02-design
    paths:
      - ".github/workflows/fix-toren-router-adversarial-green.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r3-toren-adventurer-02-design
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fix router regressions and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          active_path = root / '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md'
          start_path = root / '[기획서]/00_프로젝트_허브/START_HERE.md'
          roadmap_path = root / '[기획서]/00_프로젝트_허브/ROADMAP.md'
          plan_path = root / 'docs/superpowers/plans/2026-08-11-adventurer-02-toren-long-range-reliability.md'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor missing: {old[:140]}')
              return text.replace(old, new, 1)

          active = active_path.read_text(encoding='utf-8')
          nadia_guard = '- `BS-CONTENT-20260811-01`은 직접 전투·탐험 미니게임을 추가하지 않는다.'
          toren_guards = '\n'.join((
              nadia_guard,
              '- `BS-CONTENT-20260811-02`는 직접 이동·지도 경로 선택·실시간 생존 조작을 추가하지 않는다.',
              '- `BS-CONTENT-20260811-02`는 새 신뢰성·휴대성·수리 용이성 원수치를 만들지 않는다.',
              '- `BS-CONTENT-20260811-02`는 자동 매일 내구도 감소·루틴 수리세를 만들지 않는다.',
          ))
          active = replace_once(active, nadia_guard, toren_guards, 'active Toren guards')
          active_path.write_text(active, encoding='utf-8')

          start = start_path.read_text(encoding='utf-8')
          start = replace_once(
              start,
              '사용자 승인 Decision: `BS-CONTENT-20260811-01`.',
              '첫 승인 완료 Decision: `BS-CONTENT-20260811-01`.',
              'start Nadia historical label',
          )
          old_order = '\n'.join((
              '7. `docs/planning/BLACKSMITH_CURRENT_GAME_BIBLE_R2_2026.md`',
              '7. `ACTIVE_CONTEXT.md`',
              '8. `DEVELOPMENT_GATES.md`',
              '9. `ROADMAP.md`',
              '10. 실제 code/data/Scene/tests',
              '11. Google Sheet `00`, `01`, `02`, `04`, `13`, `50` current rows',
          ))
          new_order = '\n'.join((
              '7. `docs/planning/BLACKSMITH_CURRENT_GAME_BIBLE_R2_2026.md`',
              '8. `ACTIVE_CONTEXT.md`',
              '9. `DEVELOPMENT_GATES.md`',
              '10. `ROADMAP.md`',
              '11. 실제 code/data/Scene/tests',
              '12. Google Sheet `00`, `01`, `02`, `04`, `13`, `50` current rows',
          ))
          start = replace_once(start, old_order, new_order, 'start read-order numbering')
          start_guard = '- `BS-CONTENT-20260811-01`은 대장장이의 작품 선택·인과 판독·같은 UID 생애 환류를 보호한다.'
          start_guards = '\n'.join((
              start_guard,
              '- `BS-CONTENT-20260811-02`는 직접 이동·지도 경로 선택·실시간 생존 조작을 추가하지 않는다.',
              '- `BS-CONTENT-20260811-02`는 새 신뢰성·휴대성·수리 용이성 원수치를 만들지 않는다.',
              '- `BS-CONTENT-20260811-02`는 자동 매일 내구도 감소·루틴 수리세를 만들지 않는다.',
          ))
          start = replace_once(start, start_guard, start_guards, 'start Toren guards')
          start_path.write_text(start, encoding='utf-8')

          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = replace_once(
              roadmap,
              'CURRENT_STAGE_STATUS: R3_R7_2_OF_10_USER_APPROVED_PLANNING_CANON',
              'CURRENT_STAGE_STATUS: R3_R7_2_OF_10_USER_APPROVED_PLANNING_ONLY',
              'roadmap truthful premerge status',
          )
          roadmap = replace_once(roadmap, '현재 승인 카운터: `1/10`.', '현재 승인 카운터: `2/10`.', 'roadmap prose counter')

          trailing = '\n'.join((
              '## R3–R7 Decision 02 — 토렌 마치 장거리 여정',
              '',
              '- Decision: `BS-CONTENT-20260811-02 / R3_R7_2_OF_10`',
              '- Content: `ADVENTURER_02 / TOREN_MARCH`',
              '- 목표: `JOURNEY_CONTINUITY_AND_RELIABILITY`',
              '- 기존 `WEIGHT / DURABILITY / ENVIRONMENTAL_SEALING / FIELD_SERVICEABILITY`만 소비하고 새 신뢰성·수리성 원수치를 만들지 않는다.',
              '- 직접 여행·지도 경로·생존 미니게임과 자동 마모세를 추가하지 않는다.',
              '- 결과는 도착·경로 노출·같은 UID 작품 상태를 분리해 수리·복원·후속 강화·다음 여정 신작 이유로 환류한다.',
              '- 제품 구현: `BLOCKED`.',
              '- Task3 구현: `NOT_APPROVED`.',
          ))
          roadmap = replace_once(roadmap, trailing, '', 'roadmap trailing Toren block')

          toren_subsection = '\n'.join((
              '### 2/10 — `BS-CONTENT-20260811-02`',
              '',
              '```text',
              'ADVENTURER_02 / TOREN_MARCH',
              '토렌 마치 장거리 여정 개인 일정',
              'JOURNEY_CONTINUITY_AND_RELIABILITY',
              '```',
              '',
              '목표:',
              '',
              '- 기존 `WEIGHT / DURABILITY / ENVIRONMENTAL_SEALING / FIELD_SERVICEABILITY`만 소비해 장거리 환경 노출과 작품 신뢰성을 판단한다.',
              '- 직접 이동·지도 경로 선택·실시간 생존 조작을 추가하지 않는다.',
              '- 새 신뢰성·휴대성·수리 용이성 원수치를 만들지 않는다.',
              '- 자동 매일 내구도 감소·루틴 수리세를 만들지 않는다.',
              '- 결과는 도착·경로 노출·같은 UID 작품 상태를 분리하고 수리·복원·후속 강화·다음 여정 신작 이유로 환류한다.',
              '- 정확한 기간·확률·마모량·수리량·보상·비용은 `BASELINE_TEST_PRESET / USER_PLAYTEST_REQUIRED`다.',
              '',
              '책임 원본:',
              '',
              '- `docs/planning/CURRENT_R3_R7_CANON_REGISTRY.json`',
              '- `docs/planning/BLACKSMITH_R3_ADVENTURER_02_TOREN_MARCH_LONG_RANGE_RELIABILITY_CANON_2026.md`',
              '',
          ))
          nadia_end = '정확한 기간·확률·보상·손실·복구 비용은 `BASELINE_TEST_PRESET / USER_PLAYTEST_REQUIRED`다.\n\n## R3 — 버티컬 슬라이스 기반'
          roadmap = replace_once(
              roadmap,
              nadia_end,
              '정확한 기간·확률·보상·손실·복구 비용은 `BASELINE_TEST_PRESET / USER_PLAYTEST_REQUIRED`다.\n\n' + toren_subsection + '## R3 — 버티컬 슬라이스 기반',
              'roadmap 2/10 placement',
          )
          roadmap = replace_once(
              roadmap,
              '현재 `BS-CONTENT-20260811-01`은 이 단계의 **콘텐츠 설계**만 구체화한다. 실제 제품 구현은 열지 않는다.',
              '`BS-CONTENT-20260811-01`은 1/10 완료 이력이며 현재 `BS-CONTENT-20260811-02`가 두 번째 **콘텐츠 설계**를 구체화한다. 둘 모두 실제 제품 구현을 열지 않는다.',
              'roadmap current decision prose',
          )
          roadmap = replace_once(
              roadmap,
              '`BS-CONTENT-20260811-01`의 플레이테스트는 작품 선택 행동과 중립적 회상 인터뷰를 함께 사용한다. 실제 playable scope와 사람 검증은 아직 `NOT_RUN`이다.',
              '`BS-CONTENT-20260811-01`과 `BS-CONTENT-20260811-02`의 플레이테스트는 작품 선택 행동과 중립적 회상 인터뷰를 함께 사용한다. 실제 playable scope와 사람 검증은 아직 `NOT_RUN`이다.',
              'roadmap playtest scope',
          )
          roadmap = replace_once(
              roadmap,
              'BS-CONTENT-20260811-01: USER_APPROVED_PLANNING_ONLY\nPRODUCT_IMPLEMENTATION: BLOCKED',
              'BS-CONTENT-20260811-01: USER_APPROVED_PLANNING_ONLY\nBS-CONTENT-20260811-02: USER_APPROVED_PLANNING_ONLY\nPRODUCT_IMPLEMENTATION: BLOCKED',
              'roadmap implementation gate',
          )
          roadmap_path.write_text(roadmap.rstrip() + '\n', encoding='utf-8')

          plan = plan_path.read_text(encoding='utf-8')
          plan = replace_once(
              plan,
              '"status": "USER_APPROVED_R3_R7_2_OF_10_MAIN_CANON"',
              '"status": "USER_APPROVED_R3_R7_2_OF_10"',
              'plan truthful premerge status',
          )
          plan_path.write_text(plan, encoding='utf-8')
          PY

          python -m unittest tests.test_r3_adventurer_02_toren_content -v
          python -m unittest \
            tests.test_project_total_instruction_v45_r2_canon \
            tests.test_base_v942_planning_first_adoption \
            tests.test_project_adapter_long_lived_pr_baseline \
            tests.test_r3_adventurer_01_nadia_content \
            tests.test_r3_adventurer_02_toren_content -v

          git rm .github/workflows/prove-toren-router-adversarial-red.yml
          git rm .github/workflows/fix-toren-router-adversarial-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/START_HERE.md' \
            '[기획서]/00_프로젝트_허브/ROADMAP.md' \
            docs/superpowers/plans/2026-08-11-adventurer-02-toren-long-range-reliability.md
          git commit -m "docs: close Toren router adversarial regressions"
          git push origin HEAD:agent/r3-toren-adventurer-02-design
