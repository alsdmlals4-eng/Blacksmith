name: Temporary Migrate Project Base Adapter

on:
  push:
    branches:
      - agent/rebuild-thin-base-adapter-wave-b
    paths:
      - tools/migrate_project_base_adapter_wave_b.py
      - tests/test_project_base_adapter_thin_migration.py
      - .github/workflows/temporary-migrate-project-base-adapter.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/rebuild-thin-base-adapter-wave-b
          fetch-depth: 0

      - name: Check out trusted Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Preserve state and rebuild thin adapter
        run: python tools/migrate_project_base_adapter_wave_b.py

      - name: Regenerate Base-owned operating artifacts
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base b1dd945875568098b107815a03e88b0272d384e9 \
            --write

      - name: Verify migration and Base contract
        run: |
          python -m unittest tests.test_project_base_adapter_thin_migration -v
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base b1dd945875568098b107815a03e88b0272d384e9 \
            --check

      - name: Remove one-time migration surfaces
        run: |
          rm tools/migrate_project_base_adapter_wave_b.py
          rm .github/workflows/temporary-migrate-project-base-adapter.yml
          rm -rf .base-contract

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: rebuild Blacksmith thin Base adapter"
          git push origin HEAD:agent/rebuild-thin-base-adapter-wave-b
