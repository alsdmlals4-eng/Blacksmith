name: Apply R2 Checkpoint 005 Contract Migration

on:
  push:
    branches:
      - agent/r2-checkpoint-005-postmerge-closure
    paths:
      - "tools/close_r2_checkpoint_005.py"
      - ".github/workflows/apply-r2-checkpoint-005-contract-migration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-checkpoint-005-postmerge-closure
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply idempotent closure and contract migration
        run: python tools/close_r2_checkpoint_005.py
      - name: Commit generated updates
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CURRENT_CONFIRMED_DECISIONS.md \
            docs/PROJECT_OPERATING_HEALTH.json \
            docs/planning/CURRENT_R2_CANON_REGISTRY.json \
            docs/planning/BLACKSMITH_R2_CHECKPOINT_005_POSTMERGE_CLOSURE_2026.md \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/ROADMAP.md' \
            '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md' \
            tests/test_base_v942_planning_first_adoption.py \
            tests/test_r2_artistry_generation_growth_economy.py \
            tests/test_r2_customer_equipment_compatibility.py \
            tests/test_r2_mobile_customer_card_progressive_disclosure.py \
            tests/test_r2_enhancement_dominant_simple_load_gate.py \
            tests/test_r2_equipment_base_weight_points.py \
            tests/test_r2_weight_performance_budget_and_lightweight_tradeoff.py \
            tests/test_r2_weight_budget_conversion_and_role_presets.py \
            tests/test_r2_item_role_stat_and_initial_function_catalog.py \
            tests/test_r2_initial_role_stat_preset_and_enhancement_function_ownership.py \
            tests/test_r2_function_recipe_material_fit_and_playtest.py \
            tests/test_r2_checkpoint_005_postmerge_closure.py
          git commit -m "test: migrate Batch 005 contracts to merged canon"
          git push origin HEAD:agent/r2-checkpoint-005-postmerge-closure
