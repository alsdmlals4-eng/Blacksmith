name: Apply Decision07 router post-change cleanup

on:
  push:
    branches:
      - docs/r3-soldier-02-liana-mission-fit
    paths:
      - .github/workflows/d07-router-cleanup.yml
      - tools/_d07_router_cleanup.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/r3-soldier-02-liana-mission-fit
          fetch-depth: 0

      - name: Remove stale current-router tails
        run: python tools/_d07_router_cleanup.py

      - name: Verify current router contracts
        run: |
          python tests/check_project_core_alignment_current.py
          python -m unittest tests.test_r3_soldier_01_marek_content -v
          python -m unittest tests.test_r3_soldier_02_liana_content -v
          python -m unittest tests.test_r3_collector_01_ersa_content -v
          python -m unittest tests.test_r3_gladiator_01_cassia_content -v

      - name: Remove one-shot cleanup tools
        run: |
          rm tools/_d07_router_cleanup.py
          rm .github/workflows/d07-router-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: remove stale Decision07 router tails"
          git push origin HEAD:docs/r3-soldier-02-liana-mission-fit
