name: Temporary Finalize Base v9.4.1

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-finalize-base-v9-4-1.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/base-shared-external-ai-adapter-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Pin released Base and update current consumers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = "3f2c4a624d302b704c1b5322eb5c9f34ad55abb9"
          evidence = "ff117d24d5bdb121314e109a6aa9b4f552e0fdc1"
          adapter_path = Path("skills/PROJECT_BASE_ADAPTER.json")
          adapter = json.loads(adapter_path.read_text(encoding="utf-8"))
          adapter["base_release"].update(version="9.4.1", release_commit=payload, release_evidence_commit=evidence)
          policy = adapter["shared_overrides"]["orchestrating-deepseek-worktrees"]
          policy.update(base_validator_adoption="ADOPTED_FROM_BASE_V9_4_1", base_validator_path="tools/check_external_ai_worktree_contract.py", base_release_lock="base-v9.4.1.lock.json", actual_external_ai_worktree_execution="NOT_RUN")
          adapter_path.write_text(json.dumps(adapter, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          for path in Path("tests").glob("test_base*.py"):
              text = path.read_text(encoding="utf-8")
              if "base_release" not in text and "BASE_RELEASE_COMMIT" not in text:
                  continue
              text = text.replace("a728712cb776ec98f4875914a580fcf7d0156593", payload).replace("ef1fba11167e4da0b298123b0c85ebd268191a42", evidence).replace('"9.4.0"', '"9.4.1"').replace("DEFER_UNTIL_NEXT_RELEASED_BASE_PIN", "ADOPTED_FROM_BASE_V9_4_1")
              if path.name == "test_base_shared_external_ai_adapter.py" and "base_validator_path" not in text:
                  anchor = 'self.assertEqual("ADOPTED_FROM_BASE_V9_4_1", override["base_validator_adoption"])'
                  text = text.replace(anchor, anchor + '\n        self.assertEqual("tools/check_external_ai_worktree_contract.py", override["base_validator_path"])\n        self.assertEqual("base-v9.4.1.lock.json", override["base_release_lock"])\n        self.assertEqual("NOT_RUN", override["actual_external_ai_worktree_execution"])')
              if path.name == "test_base_shared_external_ai_adapter.py" and "release_evidence_commit" not in text:
                  anchor = 'self.assertEqual(BASE_RELEASE_COMMIT, adapter["base_release"]["release_commit"])'
                  text = text.replace(anchor, anchor + f'\n        self.assertEqual("{evidence}", adapter["base_release"]["release_evidence_commit"])')
              path.write_text(text, encoding="utf-8")
          PY
          python tests/test_base_shared_external_ai_adapter.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json tests
          git commit -m "chore: finalize Base v9.4.1 project connection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
