name: Apply Enhancement-Dominant Simple Load Gate Canon

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - "tools/apply_enhancement_dominant_simple_load_gate_canon.py"
      - ".github/workflows/apply-enhancement-dominant-simple-load-gate-canon.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply approved canon
        run: |
          python tools/apply_enhancement_dominant_simple_load_gate_canon.py
          python - <<'PY'
          from pathlib import Path

          mobile = Path("docs/planning/BLACKSMITH_R2_MOBILE_CUSTOMER_CARD_PROGRESSIVE_DISCLOSURE_CANON_2026.md")
          text = mobile.read_text(encoding="utf-8")
          marker = "<!-- ACTIVE_BATCH_REFINED_BY_BS-CUSTOMER-20260806-01 -->"
          if marker not in text:
              text = text.rstrip() + "\n\n" + marker + "\n현재 활성 배치: `R2_BATCH_005_4_OF_10`\n"
              mobile.write_text(text, encoding="utf-8")

          validator = Path("tests/check_project_core_alignment.py")
          text = validator.read_text(encoding="utf-8")
          text = text.replace("R2_BATCH_005_2_OF_10", "R2_BATCH_005_4_OF_10")
          validator.write_text(text, encoding="utf-8")
          PY
      - name: Run focused contracts
        run: |
          python -m unittest \
            tests.test_base_v942_planning_first_adoption \
            tests.test_r2_artistry_generation_growth_economy \
            tests.test_r2_customer_equipment_compatibility \
            tests.test_r2_mobile_customer_card_progressive_disclosure \
            tests.test_r2_enhancement_dominant_simple_load_gate \
            -v
          python tests/check_project_core_alignment.py
      - name: Remove one-shot automation files
        run: rm tools/apply_enhancement_dominant_simple_load_gate_canon.py .github/workflows/apply-enhancement-dominant-simple-load-gate-canon.yml
      - name: Commit GREEN canon synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CANON: approve enhancement-dominant simple load gate"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
