name: Harden Blacksmith Local Executor

on:
  push:
    branches:
      - ops/blacksmith-local-executor-postmerge-hardening
    paths:
      - .github/workflows/_harden-blacksmith-local-executor.yml
      - tools/_harden_blacksmith_local_executor.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/blacksmith-local-executor-postmerge-hardening
          fetch-depth: 0
      - name: Materialize strict editor and port isolation
        run: python tools/_harden_blacksmith_local_executor.py
      - name: Remove one-shot hardening helpers
        run: |
          rm tools/_harden_blacksmith_local_executor.py
          rm .github/workflows/_harden-blacksmith-local-executor.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ops: fail closed on duplicate editor and orphan ports"
          git push origin HEAD:ops/blacksmith-local-executor-postmerge-hardening
