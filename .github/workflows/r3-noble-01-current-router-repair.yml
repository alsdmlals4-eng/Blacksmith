name: One-shot R3 Noble 01 current router repair

on:
  push:
    branches:
      - docs/r3-noble-01-heirloom-succession

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[router-audit-decision06]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r3-noble-01-heirloom-succession
          fetch-depth: 0
      - name: Reconcile Decision06 current routers and audit
        run: python tools/_tmp_reconcile_decision06_current.py
      - name: Commit reconciled current state
        shell: bash
        run: |
          rm -f .github/workflows/r3-noble-01-current-router-repair.yml
          rm -f tools/_tmp_reconcile_decision06_current.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: reconcile Decision06 current routers and audit [router-audit-decision06]"
          git push origin HEAD:docs/r3-noble-01-heirloom-succession
