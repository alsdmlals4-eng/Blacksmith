name: TEMP / Materialize approved Marek and auto-cap canon

on:
  push:
    branches:
      - agent/r3-marek-auto-enhancement-cap

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize current canon and consumers
        run: python tools/_materialize_r3_marek_auto_cap.py
      - name: Run focused GREEN candidates
        run: |
          python -m unittest \
            tests.test_r3_soldier_01_marek_content \
            tests.test_auto_enhancement_cap_unlock
      - name: Push non-workflow materialization
        run: |
          # GITHUB_TOKEN cannot update workflow files in this repository. Keep all
          # workflow changes out of this bot commit; connector-authorized cleanup
          # and validation wiring are applied afterward.
          git checkout HEAD -- .github/workflows/python-validation.yml
          rm -f tools/_materialize_r3_marek_auto_cap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: canonize Marek and progressive auto enhancement cap"
          git push origin HEAD:${GITHUB_REF_NAME}
