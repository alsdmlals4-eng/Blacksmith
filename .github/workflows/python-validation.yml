name: Reusable Python validation

on:
  workflow_call:
    inputs:
      scope:
        description: docs or code
        required: true
        type: string
      runner:
        description: GitHub-hosted runner label
        required: false
        default: ubuntu-latest
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.12"
        type: string
      include-operating-audit:
        description: Run the project-to-Base operating audit
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        default: code
        type: choice
        options:
          - docs
          - code
      runner:
        description: Runner label
        required: true
        default: ubuntu-latest
        type: string
      python-version:
        description: Python version
        required: true
        default: "3.12"
        type: string
      include-operating-audit:
        description: Include project-to-Base audit
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.python-version }}-${{ inputs.scope }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: ${{ inputs.runner }} / Python ${{ inputs.python-version }} / ${{ inputs.scope }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout Blacksmith
        uses: actions/checkout@v4
        with:
          path: project
          fetch-depth: 0

      - name: Checkout pinned Base
        if: inputs.include-operating-audit
        uses: actions/checkout@v4
        with:
          repository: alsdmlals4-eng/Base
          ref: 41a20584dd2ee51d917e5c9d7cab6838e1ceba7e
          path: base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Reject unresolved merge conflicts
        working-directory: project
        run: |
          python -m unittest tests/test_no_merge_conflicts.py
          python tests/check_no_merge_conflicts.py .

      - name: Validate document and CI contracts
        working-directory: project
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5
          : > document-contracts.log
          run_contract() {
            label="$1"
            shift
            echo "=== BEGIN $label ===" >> document-contracts.log
            set +e
            "$@" >> document-contracts.log 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "=== FAILED $label status=$status ===" >> document-contracts.log
              cat document-contracts.log
              exit "$status"
            fi
            echo "=== PASS $label ===" >> document-contracts.log
          }
          run_contract core_alignment python tests/check_project_core_alignment_current.py
          run_contract ci_workflow_structure python -m unittest tests/test_ci_workflow_structure.py
          run_contract higodot_gut_authority python -m pytest tests/test_higodot_gut_authority_gate.py -q
          run_contract higodot_production_activation python -m pytest tests/test_higodot_production_authoring_activation.py -q
          run_contract editor_plugin_runtime python -m pytest tests/test_user_approved_editor_plugin_runtime_contract.py -q
          run_contract gut_formal_adoption python -m unittest tests/test_gut_formal_adoption_contract.py -v
          run_contract hera_vendor_reconciliation python -m pytest tests/test_hera_vendor_reconciliation_contract.py -q
          run_contract hera_postmerge_closure python -m pytest tests/test_hera_postmerge_closure_contract.py -q
          run_contract new_campaign_initializer python -m unittest tests.test_vertical_slice_new_campaign_initializer_authority -v
          run_contract higodot_task2_bridge python -m pytest tests/test_higodot_task2_ci_authoring_bridge_contract.py -q
          run_contract higodot_exact_diff_hygiene python -m pytest tests/test_higodot_task2_exact_diff_hygiene.py -q
          run_contract higodot_mcp_driver python -m pytest tests/test_higodot_task2_mcp_driver.py -q
          run_contract higodot_toolchain_pin python -m pytest tests/test_higodot_task2_toolchain_pin.py -q
          run_contract higodot_313_runtime python -m pytest tests/test_higodot_task2_313_runtime_contract.py -q
          run_contract editor_plugin_sync python -m pytest tests/test_user_approved_editor_plugin_sync_contract.py -q
          run_contract higodot_post_authoring python -m pytest tests/test_higodot_task2_post_authoring_gate.py -q
          run_contract higodot_provenance python -m pytest tests/test_higodot_task2_provenance_artifact.py -q
          run_contract higodot_publish_guard python -m pytest tests/test_higodot_task2_publish_guard.py -q
          run_contract higodot_real_prove python -m pytest tests/test_higodot_task2_real_prove_contract.py -q

      - name: Upload document contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: document-contracts-log
          path: project/document-contracts.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate archive retention governance
        working-directory: project
        run: |
          python tools/check_archive_governance.py
          python -m unittest tests.test_archive_retention_governance -v

      - name: Validate project operating audit wrapper
        if: inputs.include-operating-audit
        working-directory: project
        run: |
          python -m unittest tests/test_project_operating_system_audit_runner.py
          python tools/run_project_operating_system_audit.py --base-root ../base --report artifacts/base-adoption-report.json

      - name: Validate game and lifecycle data
        if: inputs.scope == 'code'
        working-directory: project
        run: |
          python tools/validate_game_data.py
          python tools/validate_lifecycle_data.py
          python -m unittest tests/test_lifecycle_data_contract.py

      - name: Validate vertical slice Task 1 canon contract
        if: inputs.scope == 'code'
        working-directory: project
        run: python -m unittest tests.test_vertical_slice_task1_canon_contract -v

      - name: Validate vertical slice Task 2 app shell contract
        if: inputs.scope == 'code'
        working-directory: project
        run: python -m unittest tests.test_vertical_slice_task2_app_shell_contract -v

      - name: Validate forging quality contract
        if: inputs.scope == 'code'
        working-directory: project
        run: python tests/check_forging_quality_contract.py

      - name: Validate enhancement failure contract
        if: inputs.scope == 'code'
        working-directory: project
        shell: bash
        run: |
          set +e
          python tests/check_enhancement_failure_contract.py > enhancement-failure-contract.log 2>&1
          status=$?
          cat enhancement-failure-contract.log
          exit "$status"

      - name: Upload enhancement failure diagnostics
        if: failure() && inputs.scope == 'code'
        uses: actions/upload-artifact@v4
        with:
          name: enhancement-failure-contract-log
          path: project/enhancement-failure-contract.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate enhancement balance simulator
        if: inputs.scope == 'code'
        working-directory: project
        run: python -m unittest tests/test_enhancement_balance_simulator.py

      - name: Validate enhancement balance simulator contract
        if: inputs.scope == 'code'
        working-directory: project
        run: python tests/check_enhancement_balance_simulator_contract.py
