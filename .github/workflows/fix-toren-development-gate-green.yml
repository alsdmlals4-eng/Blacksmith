name: Fix Toren Development Gate GREEN

on:
  push:
    branches:
      - agent/r3-toren-adventurer-02-design
    paths:
      - ".github/workflows/fix-toren-development-gate-green.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r3-toren-adventurer-02-design
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Align current development gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md')
          text = path.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'{label} anchor missing: {old}')
              text = text.replace(old, new, 1)

          once(
              '> **R3_R7_DESIGN_ACTIVE / BS-CONTENT-20260811-01 / PLANNING_ONLY / PRODUCT_BLOCKED**',
              '> **R3_R7_DESIGN_ACTIVE / BS-CONTENT-20260811-02 / ADVENTURER_02_TOREN_LONG_RANGE_RELIABILITY_APPROVED / PLANNING_ONLY / PRODUCT_BLOCKED**',
              'heading',
          )
          once('R3_R7_APPROVAL_COUNTER: 1/10', 'R3_R7_APPROVAL_COUNTER: 2/10', 'counter')
          text = text.replace('R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-01', 'R3_R7_CURRENT_DECISION: BS-CONTENT-20260811-02')
          once(
              'Decision: `BS-CONTENT-20260811-01`.\n\n```text\nADVENTURER_01 / NADIA_VENN\n생환 + 회수\n```',
              '첫 승인 완료 Decision: `BS-CONTENT-20260811-01 / ADVENTURER_01 / NADIA_VENN`.\n\nDecision: `BS-CONTENT-20260811-02`.\n\n```text\nADVENTURER_02 / TOREN_MARCH\nJOURNEY_CONTINUITY_AND_RELIABILITY\n```',
              'planning decision block',
          )
          once(
              '- 비정본 `BASELINE_TEST_PRESET` 후보와 플레이테스트 설계',
              '- 비정본 `BASELINE_TEST_PRESET` 후보와 플레이테스트 설계\n- 기존 `WEIGHT / DURABILITY / ENVIRONMENTAL_SEALING / FIELD_SERVICEABILITY` 승인 책임을 실제 관련 맥락에서 소비',
              'allowed owners',
          )
          once(
              '- 직접 전투·탐험 미니게임 추가',
              '- 직접 이동·지도 경로 선택·실시간 생존 조작 추가\n- 새 신뢰성·휴대성·수리 용이성 원수치 추가\n- 자동 매일 내구도 감소·루틴 수리세 추가',
              'Toren blocked scope',
          )
          once(
              '`BS-CONTENT-20260811-01`은 planning-only Decision이다. 이 Decision의 승인만으로 제품 구현, Task3, HiGodot authoring scope를 개방하지 않는다.',
              '`BS-CONTENT-20260811-01`과 현재 `BS-CONTENT-20260811-02`는 planning-only Decision이다. 이 승인들만으로 제품 구현, Task3, HiGodot authoring scope를 개방하지 않는다.',
              'product gate planning boundary',
          )
          path.write_text(text, encoding='utf-8')
          PY

          python -m unittest tests.test_r3_adventurer_02_toren_content -v
          python -m unittest tests/test_project_operating_system_audit_runner.py -v

          git rm .github/workflows/prove-toren-development-gate-red.yml
          git rm .github/workflows/fix-toren-development-gate-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md'
          git commit -m "docs: advance Toren development gate"
          git push origin HEAD:agent/r3-toren-adventurer-02-design
