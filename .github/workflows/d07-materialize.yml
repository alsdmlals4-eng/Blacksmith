name: Materialize approved Decision07 state

on:
  push:
    branches:
      - docs/r3-soldier-02-liana-mission-fit
    paths:
      - .github/workflows/d07-materialize.yml
      - tools/_d07_materialize.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          ref: docs/r3-soldier-02-liana-mission-fit
          fetch-depth: 0

      - name: Apply approved Decision07 current-state changes
        run: python tools/_d07_materialize.py

      - name: Verify focused Decision07 contract
        run: python -m unittest tests.test_r3_soldier_02_liana_content -v

      - name: Remove one-shot materializer
        run: |
          rm tools/_d07_materialize.py
          rm .github/workflows/d07-materialize.yml

      - name: Commit materialized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: materialize Soldier02 Liana current state"
          git push origin HEAD:docs/r3-soldier-02-liana-mission-fit
