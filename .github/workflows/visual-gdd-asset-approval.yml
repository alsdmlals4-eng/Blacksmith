name: Validate Visual GDD Asset Approval

on:
  pull_request:
    paths:
      - "docs/planning/BLACKSMITH_VISUAL_GDD_ASSET_APPROVAL_2026-08-25.md"
      - "tests/check_visual_gdd_asset_approval.py"
      - ".github/workflows/visual-gdd-asset-approval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate approved Visual GDD manifest
        run: python tests/check_visual_gdd_asset_approval.py
