name: Materialize strict thin Base adapter

on:
  push:
    branches:
      - agent/rebuild-thin-base-adapter
    paths:
      - .github/workflows/temporary-migrate-thin-base-adapter.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check out trusted Base contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Base contract dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt
      - name: Preserve project state and write strict authority files
        env:
          PROJECT_BASE_SHA: b1dd945875568098b107815a03e88b0272d384e9
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / ".base-contract" / "tools"))
          import project_operating_contract as contract

          base_sha = os.environ["PROJECT_BASE_SHA"]
          adapter_path = root / "skills/PROJECT_BASE_ADAPTER.json"
          health_path = root / "docs/PROJECT_OPERATING_HEALTH.json"
          migration_path = root / "docs/operations/BLACKSMITH_ADAPTER_MIGRATION_STATE_2026-08-06.json"
          sheet_path = root / "docs/operations/BLACKSMITH_SHEET_AUTHORITY_EVIDENCE_2026-08-06.json"
          old = json.loads(adapter_path.read_text(encoding="utf-8"))
          old_health = json.loads(health_path.read_text(encoding="utf-8"))

          migrated_root_keys = (
              "current_operating_decisions",
              "project_operating_state",
              "current_r1_canon",
              "validation_status",
          )
          migration = {
              "artifact_role": "BLACKSMITH_ADAPTER_MIGRATION_STATE",
              "schema_version": 1,
              "decision_id": "DEC-BASE-20260805-001",
              "repository": "alsdmlals4-eng/Blacksmith",
              "baseline_commit": base_sha,
              "migration_policy": "LOSSLESS_PROJECT_STATE_OUTSIDE_BASE_ADAPTER",
              "migrated_adapter_root_fields": {
                  key: old[key] for key in migrated_root_keys if key in old
              },
              "legacy_adapter_snapshot": old,
              "legacy_project_operating_health": old_health,
              "authority_mapping": {
                  "base_adapter": "skills/PROJECT_BASE_ADAPTER.json",
                  "strict_health": "docs/PROJECT_OPERATING_HEALTH.json",
                  "root_decisions": "CURRENT_CONFIRMED_DECISIONS.md",
                  "r1_registry": "docs/planning/CURRENT_R1_CANON_REGISTRY.json",
                  "sheet_evidence": sheet_path.relative_to(root).as_posix(),
              },
              "product_mutation": "NONE",
              "google_sheet_mutation": "NONE",
          }
          migration_path.parent.mkdir(parents=True, exist_ok=True)
          migration_path.write_bytes(contract.canonical_json(migration))

          sheet_evidence = {
              "artifact_role": "BLACKSMITH_SHEET_AUTHORITY_EVIDENCE",
              "schema_version": 1,
              "decision_id": "DEC-BASE-20260805-001",
              "repository": "alsdmlals4-eng/Blacksmith",
              "source_adapter_baseline": base_sha,
              "legacy_gdd_sheet": old["gdd_sheet"],
              "sheet_mutation": "NONE",
              "interpretation": "Existing GitHub-to-Sheet sync evidence is preserved; this adapter migration performs no Sheet write.",
          }
          sheet_path.write_bytes(contract.canonical_json(sheet_evidence))

          project_registry_path = old["skill_registry"]["project"]["path"]
          project_registry_raw = subprocess.check_output(
              ["git", "show", f"{base_sha}:{project_registry_path}"]
          )
          project_registry_hash = hashlib.sha256(project_registry_raw).hexdigest()

          base_routes = [
              {"route_id": item["route_id"], "skill_id": item["skill_id"], "status": "ACTIVE"}
              for item in old["routing"]["base_routes"]
          ]
          project_routes = []
          inactive_routes = list(old["routing"].get("inactive_routes", []))
          for item in old["routing"]["project_routes"]:
              route = {"route_id": item["route_id"], "skill_id": item["skill_id"], "status": "ACTIVE"}
              if item.get("status") == "ACTIVE":
                  project_routes.append(route)
              else:
                  inactive_routes.append({**route, "status": "HOLD"})

          gdd_sheet = dict(old["gdd_sheet"])
          gdd_sheet["declared_sync_status"] = old["gdd_sheet"].get("sync_status")
          gdd_sheet["sync_status"] = "CURRENT"

          strict_adapter = {
              "schema_version": 1,
              "artifact_role": "PROJECT_BASE_ADAPTER",
              "base_release": {
                  key: old["base_release"][key]
                  for key in (
                      "repository",
                      "version",
                      "release_commit",
                      "release_evidence_commit",
                      "finalization_commit",
                  )
                  if key in old["base_release"]
              },
              "project": old["project"],
              "routing": {
                  "base_routes": base_routes,
                  "project_routes": project_routes,
                  "inactive_routes": inactive_routes,
                  "aliases": old["routing"].get("aliases", []),
                  "precedence": "PROJECT_LOCAL_THEN_BASE_SHARED",
              },
              "skill_registry": {
                  "base": {
                      "path": old["skill_registry"]["base"]["path"],
                      "sha256": old["skill_registry"]["base"]["sha256"],
                      "hash_definition": "RAW_FILE_BYTES_SHA256",
                  },
                  "project": {
                      "path": project_registry_path,
                      "sha256": project_registry_hash,
                      "hash_definition": "RAW_FILE_BYTES_SHA256",
                  },
              },
              "shared_overrides": old["shared_overrides"],
              "gdd_sheet": gdd_sheet,
              "protected_baseline": {
                  "authority_kind": "REMOTE_TRACKING_REF",
                  "authority_ref": "refs/remotes/origin/main",
                  "commit": base_sha,
                  "policy_source_type": "FIRST_MIGRATION_LEGACY_SOURCE",
                  "policy_source_path": "skills/PROJECT_BASE_ADAPTER.json",
                  "protected_paths_pointer": "/protected_paths",
                  "policy_sha256": contract._protected_policy_hash(old["protected_paths"]),
              },
              "protected_paths": old["protected_paths"],
              "validators": [str(item) for item in old["validators"]],
              "compatibility": {
                  "cycle": old["compatibility"]["cycle"],
                  "views": old["compatibility"]["views"],
                  "legacy_inputs": old["compatibility"]["legacy_inputs"],
              },
          }
          adapter_path.write_bytes(contract.canonical_json(strict_adapter))

          def evidence_record(record_id: str, source: str) -> dict[str, str]:
              path = root / source
              if not path.is_file():
                  raise SystemExit(f"missing evidence source: {source}")
              return {"id": record_id, "source": source, "sha256": contract.sha256_file(path)}

          strict_health = {
              "schema_version": 1,
              "artifact_role": "PROJECT_OPERATING_HEALTH",
              "operating_maturity": "OM-L3",
              "product_evidence_maturity": "PE-0",
              "critical_gates": {
                  "static": "PASS",
                  "runtime": "NOT_RUN",
                  "device": "NOT_RUN",
                  "accessibility": "NOT_RUN",
                  "human": "NOT_RUN",
              },
              "integrity_verdict": "PASS_WITH_NOT_RUN_GATES",
              "evidence": {
                  "operating": [
                      evidence_record("BS-ADAPTER-MIGRATION-20260806", migration_path.relative_to(root).as_posix()),
                      evidence_record("BS-CURRENT-DECISIONS", "CURRENT_CONFIRMED_DECISIONS.md"),
                      evidence_record("BS-R1-CANON-REGISTRY", "docs/planning/CURRENT_R1_CANON_REGISTRY.json"),
                  ],
                  "product": [],
                  "sheet": [
                      evidence_record("BS-SHEET-AUTHORITY-20260806", sheet_path.relative_to(root).as_posix())
                  ],
                  "gates": {
                      "static": [
                          evidence_record("BS-STATIC-RECOVERY-REPORT", "docs/operations/BS-OPS-20260802-01_FINAL_REPORT.md")
                      ],
                      "runtime": [],
                      "device": [],
                      "accessibility": [],
                      "human": [],
                  },
              },
          }
          health_path.write_bytes(contract.canonical_json(strict_health))
          PY
      - name: Generate Base-owned views and validate
        env:
          PROJECT_BASE_SHA: b1dd945875568098b107815a03e88b0272d384e9
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROJECT_BASE_SHA" \
            --write
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROJECT_BASE_SHA" \
            --check
          python tests/test_project_base_adapter_thin_migration.py -v
      - name: Commit authority and generated views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/PROJECT_BASE_ADAPTER.json \
            docs/PROJECT_OPERATING_HEALTH.json \
            docs/operations/BLACKSMITH_ADAPTER_MIGRATION_STATE_2026-08-06.json \
            docs/operations/BLACKSMITH_SHEET_AUTHORITY_EVIDENCE_2026-08-06.json \
            skills/PROJECT_SKILL_SNAPSHOT.json \
            docs/PROJECT_OPERATING_DASHBOARD.html \
            .agents/skills/blacksmith-workflow-router/SKILL.md \
            skills/BASE_V9_ADAPTER.json \
            skills/PROJECT_BASE_SKILL_ADAPTER.json
          git diff --cached --check
          git commit -m "fix: materialize strict thin Base adapter"
          git push origin HEAD:agent/rebuild-thin-base-adapter
