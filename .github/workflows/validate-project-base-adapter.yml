name: Validate Project Base Adapter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check out Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 4ec410e611152294f3f2685570fca6019c7abcfa
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Select the trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          git fetch origin "$PR_BASE_REF" --no-tags
          LATEST_BASE_SHA="$(git rev-parse "origin/$PR_BASE_REF")"
          ADAPTER_CHANGES="$(git diff --name-only "$PR_BASE_SHA"..."$PR_HEAD_SHA" -- "$ADAPTER_PATH")"
          if printf '%s\n' "$ADAPTER_CHANGES" | grep -Fxq "$ADAPTER_PATH"; then
            # Adapter migration PR: the adapter must explicitly adopt the latest base tip.
            PROTECTED_BASE_SHA="$LATEST_BASE_SHA"
          else
            # Normal PR: use the current merged adapter record, not the stale original PR base.
            PROTECTED_BASE_SHA="$(
              python -c 'import json, sys; payload = json.load(sys.stdin); print(payload["protected_baseline"]["commit"])' < "$ADAPTER_PATH"
            )"
          fi
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$LATEST_BASE_SHA"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Validate adapter and exact protected change approval
        env:
          EXTERNAL_APPROVAL: ${{ contains(github.event.pull_request.labels.*.name, 'approved-protected-change') }}
        run: |
          set -euo pipefail
          APPROVAL_PATH="docs/operations/PROJECT_PROTECTED_CHANGE_APPROVAL.json"
          APPROVAL_ARGS=()
          if [ -f "$APPROVAL_PATH" ]; then
            APPROVAL_ARGS=(--approval "$APPROVAL_PATH")
          fi
          python .base-contract/tools/check_approved_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --external-approval "$EXTERNAL_APPROVAL" \
            "${APPROVAL_ARGS[@]}" \
            --check
