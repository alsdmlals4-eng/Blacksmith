name: TEMP / R3 Marek and auto-cap RED proof

on:
  push:
    branches:
      - agent/r3-marek-auto-enhancement-cap

permissions:
  contents: read

jobs:
  red-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused planning contract tests
        run: |
          python -m unittest \
            tests.test_r3_soldier_01_marek_content \
            tests.test_auto_enhancement_cap_unlock
