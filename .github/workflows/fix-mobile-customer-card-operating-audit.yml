name: Fix Mobile Customer Card Operating Audit

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - "tools/fix_mobile_customer_card_operating_audit.py"
      - ".github/workflows/fix-mobile-customer-card-operating-audit.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply operating-audit fix
        run: python tools/fix_mobile_customer_card_operating_audit.py
      - name: Verify focused audit contracts
        run: |
          python tests/check_project_core_alignment.py
          python -m unittest tests.test_project_operating_system_audit_runner -v
      - name: Remove one-shot files
        run: rm tools/fix_mobile_customer_card_operating_audit.py .github/workflows/fix-mobile-customer-card-operating-audit.yml
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align mobile customer card operating audit"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
