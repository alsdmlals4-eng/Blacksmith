name: Restore Historical Task3 Gate

on:
  push:
    branches:
      - ops/blacksmith-dedicated-local-executor-bootstrap
    paths:
      - .github/workflows/_restore-historical-task3-gate.yml
      - tools/_restore_historical_task3_gate.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/blacksmith-dedicated-local-executor-bootstrap
          fetch-depth: 0
      - name: Restore historical Task3 token
        run: python tools/_restore_historical_task3_gate.py
      - name: Remove one-shot helpers
        run: |
          rm tools/_restore_historical_task3_gate.py
          rm .github/workflows/_restore-historical-task3-gate.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: restore historical R3 Task3 gate token"
          git push origin HEAD:ops/blacksmith-dedicated-local-executor-bootstrap
