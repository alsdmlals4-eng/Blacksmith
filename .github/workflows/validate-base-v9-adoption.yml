name: Validate Base v9 adoption
on: [pull_request]
jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_base_v9_adoption
  adversarial-gate:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > changed.txt
          grep -E '^(src/|scripts/|scenes/|data/|assets/|addons/|project\.godot$)' changed.txt \
            | grep -Ev '^(scripts|data)/vertical_slice/' > protected-product-paths.txt || true

          # One-shot approved repair: pull_request.number == 138 / BS-TOOLCHAIN-20260809-01.
          # It is valid only against the exact accepted protected baseline below and
          # removes exactly one already-reviewed Hera lifecycle file from this PR's
          # protected-path rejection list. Future PRs receive no addon exemption.
          if [ "${{ github.event.pull_request.number }}" = "138" ] \
             && [ "${{ github.event.pull_request.base.sha }}" = "2dddf864519a557152c6bbf0f0ee7fb94eadf11c" ]; then
            test -f docs/decisions/BS-TOOLCHAIN-20260809-01_GODOT_AI_313_HERA_GUT_PLUGIN_ACTIVATION.md
            grep -Fq "BS-TOOLCHAIN-20260809-01" \
              docs/decisions/BS-TOOLCHAIN-20260809-01_GODOT_AI_313_HERA_GUT_PLUGIN_ACTIVATION.md
            printf '%s\n' 'addons/hera_agent_godot/hera_agent_plugin.gd' \
              > approved-toolchain-protected-paths.txt
            grep -Fxv -f approved-toolchain-protected-paths.txt protected-product-paths.txt \
              > protected-product-paths.remaining.txt || true
            mv protected-product-paths.remaining.txt protected-product-paths.txt
          fi

          # One-shot approved Task 2 HiGodot repair: pull_request.number == 131 /
          # BS-HIGODOT-EXEC-20260808-01. This is deliberately narrower than an
          # addon-directory exemption: it requires the exact main baseline, exact
          # PR branch, authority Decision record, both expected changed paths, and
          # the exact reviewed blobs produced by the approved TDD implementation.
          if [ "${{ github.event.pull_request.number }}" = "131" ] \
             && [ "${{ github.event.pull_request.base.sha }}" = "c3d7f0cf0f5b3662803ae58b7176d8a996638c60" ] \
             && [ "${{ github.event.pull_request.head.ref }}" = "feat/vertical-slice-task2-app-shell" ]; then
            test -f docs/decisions/BS-HIGODOT-EXEC-20260808-01_TASK2_CI_AUTHORING_BRIDGE.md
            grep -Fq "BS-HIGODOT-EXEC-20260808-01" \
              docs/decisions/BS-HIGODOT-EXEC-20260808-01_TASK2_CI_AUTHORING_BRIDGE.md
            grep -Fxq 'addons/godot_ai/handlers/project_handler.gd' protected-product-paths.txt
            grep -Fxq 'addons/godot_ai/plugin.gd' protected-product-paths.txt
            test "$(git rev-parse '${{ github.sha }}:addons/godot_ai/handlers/project_handler.gd')" = \
              "e3c2e4568a0d44cb621742241678814df90f31f5"
            test "$(git rev-parse '${{ github.sha }}:addons/godot_ai/plugin.gd')" = \
              "e465cb9f308d3968252f08bf9e0a0a83a80b87bd"
            printf '%s\n' \
              'addons/godot_ai/handlers/project_handler.gd' \
              'addons/godot_ai/plugin.gd' \
              > approved-task2-higodot-protected-paths.txt
            grep -Fxv -f approved-task2-higodot-protected-paths.txt protected-product-paths.txt \
              > protected-product-paths.remaining.txt || true
            mv protected-product-paths.remaining.txt protected-product-paths.txt
          fi

          if [ -s protected-product-paths.txt ]; then
            echo "Unapproved product paths changed:"
            cat protected-product-paths.txt
            exit 1
          fi
          test -f skills/BASE_V9_ADAPTER.json
