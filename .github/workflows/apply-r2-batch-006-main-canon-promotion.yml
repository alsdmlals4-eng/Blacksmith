name: Apply R2 Batch 006 Main Canon Promotion

on:
  pull_request:
    types:
      - synchronize
    paths:
      - "tools/promote_r2_batch_006_main_canon.py"
      - ".github/workflows/apply-r2-batch-006-main-canon-promotion.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/close-r2-batch-006-main-canon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Promote approved Batch 006 canon
        run: python tools/promote_r2_batch_006_main_canon.py
      - name: Commit promoted authority
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No promotion changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_CONFIRMED_DECISIONS.md \
            docs/planning/BLACKSMITH_R2_BATCH_006_VERTICAL_SLICE_CANON_PROPOSAL_2026.md \
            docs/planning/R2_BATCH_006_VERTICAL_SLICE_PROPOSAL_REGISTRY.json \
            docs/planning/CURRENT_R2_CANON_REGISTRY.json \
            docs/PROJECT_OPERATING_HEALTH.json \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/ROADMAP.md' \
            '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md'
          git commit -m "canon: promote R2 Batch 006 to main authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
