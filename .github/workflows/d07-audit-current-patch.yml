name: Apply Decision07 operating-audit current patch

on:
  push:
    branches:
      - docs/r3-soldier-02-liana-mission-fit
    paths:
      - .github/workflows/d07-audit-current-patch.yml
      - tools/_d07_audit_current_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blacksmith branch
        uses: actions/checkout@v4
        with:
          ref: docs/r3-soldier-02-liana-mission-fit
          fetch-depth: 0

      - name: Checkout pinned Base used by audit wrapper
        uses: actions/checkout@v4
        with:
          repository: alsdmlals4-eng/Base
          ref: 41a20584dd2ee51d917e5c9d7cab6838e1ceba7e
          path: ../base
          persist-credentials: false

      - name: Apply Decision07 audit assertions
        run: python tools/_d07_audit_current_patch.py

      - name: Verify audit meta-contract and live wrapper
        run: |
          python -m unittest tests/test_project_operating_system_audit_runner.py -v
          python tools/run_project_operating_system_audit.py --base-root ../base --report artifacts/base-adoption-report.json

      - name: Remove one-shot patch tools
        run: |
          rm tools/_d07_audit_current_patch.py
          rm .github/workflows/d07-audit-current-patch.yml

      - name: Commit verified audit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: align operating audit with Decision07 current state"
          git push origin HEAD:docs/r3-soldier-02-liana-mission-fit
