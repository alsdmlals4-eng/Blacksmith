name: Decision09 materializer repair

on:
  push:
    branches:
      - docs/r3-gladiator-02-kyle-veteran-continuity
    paths:
      - '.github/workflows/decision09-fix-materializer.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r3-gladiator-02-kyle-veteran-continuity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make resume locator optional where a router does not own it
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/_decision09_materialize.py')
          s = p.read_text(encoding='utf-8')
          old = '''    text = require_replace(\n        text,\n        "R3_R7_RESUME_LOCATOR: COLLECTOR_02_SEDRIC_ARCHIVAL_ACCESSION_APPROVED",\n        "R3_R7_RESUME_LOCATOR: GLADIATOR_02_KYLE_VETERAN_CONTINUITY_APPROVED",\n        label=label,\n    )'''
          new = '''    old_locator = "R3_R7_RESUME_LOCATOR: COLLECTOR_02_SEDRIC_ARCHIVAL_ACCESSION_APPROVED"\n    if old_locator in text:\n        text = text.replace(\n            old_locator,\n            "R3_R7_RESUME_LOCATOR: GLADIATOR_02_KYLE_VETERAN_CONTINUITY_APPROVED",\n        )'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one locator block, got {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile tools/_decision09_materialize.py
      - name: Commit helper repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_decision09_materialize.py
          git diff --cached --check
          git commit -m "fix: allow router-specific Decision09 locators"
          git push origin HEAD:docs/r3-gladiator-02-kyle-veteran-continuity
