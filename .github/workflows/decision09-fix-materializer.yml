name: Decision09 materializer repair

on:
  push:
    branches:
      - docs/r3-gladiator-02-kyle-veteran-continuity
    paths:
      - '.github/workflows/decision09-fix-materializer.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r3-gladiator-02-kyle-veteran-continuity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make canon responsibility IDs explicit before focused GREEN
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/_decision09_materialize.py')
          s = p.read_text(encoding='utf-8')
          anchor = 'def main() -> None:\n'
          patch = '''def normalize_canon_responsibility_ids() -> None:\n    path = CANON\n    text = read(path)\n    text = text.replace(\n        "Cassia / `GLADIATOR_01`의 질문:",\n        "Cassia / `CASSIA_BELLAN / GLADIATOR_01 / ARENA_SIGNATURE_WEAPON_AND_LEGACY`의 질문:",\n    )\n    text = text.replace(\n        "Noble01 / `CEREMONIAL_NOBLE`은",\n        "Noble01 / `CEREMONIAL_NOBLE / HEIRLOOM_SUCCESSION_RESTORATION_AND_LEGACY`은",\n    )\n    write(path, text)\n\n\n'''
          if 'def normalize_canon_responsibility_ids()' in s:
              raise SystemExit('canon normalizer already exists')
          if anchor not in s:
              raise SystemExit('main anchor missing')
          s = s.replace(anchor, patch + anchor, 1)
          s = s.replace('    update_registry()\n', '    normalize_canon_responsibility_ids()\n    update_registry()\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile tools/_decision09_materialize.py
      - name: Commit helper repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_decision09_materialize.py
          git diff --cached --check
          git commit -m "fix: name Decision09 preserved responsibility owners"
          git push origin HEAD:docs/r3-gladiator-02-kyle-veteran-continuity
