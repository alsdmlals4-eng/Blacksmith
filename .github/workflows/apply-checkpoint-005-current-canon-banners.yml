name: Apply Checkpoint 005 Current Canon Banners

on:
  push:
    branches:
      - agent/r2-checkpoint-005-postmerge-closure
    paths:
      - "tools/add_checkpoint_005_banner_to_current_canons.py"
      - ".github/workflows/apply-checkpoint-005-current-canon-banners.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-checkpoint-005-postmerge-closure
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python tools/add_checkpoint_005_banner_to_current_canons.py
      - name: Commit current canon banners
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No current canon banner changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/planning/BLACKSMITH_CURRENT_GAME_BIBLE_R2_2026.md \
            docs/planning/BLACKSMITH_R2_FUNCTION_RECIPE_MATERIAL_FIT_AND_PLAYTEST_CANON_2026.md
          git commit -m "CANON: mark Batch 005 current canons closed"
          git push origin HEAD:agent/r2-checkpoint-005-postmerge-closure
