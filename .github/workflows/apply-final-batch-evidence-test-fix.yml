name: Apply Final Batch Evidence Test Fix

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - .github/workflows/apply-final-batch-evidence-test-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Patch evidence contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_r2_function_recipe_material_fit_and_playtest.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'PLAN = ROOT / "docs/superpowers/plans/2026-08-06-function-recipes-material-fit-forging-playtest.md"\n',
              'PLAN = ROOT / "docs/superpowers/plans/2026-08-06-function-recipes-material-fit-forging-playtest.md"\n'
              'EVIDENCE = ROOT / "docs/planning/BLACKSMITH_R2_FUNCTION_RECIPE_MATERIAL_FIT_AND_PLAYTEST_EVIDENCE_2026.md"\n',
              1,
          )
          text = text.replace(
              'for path in (CANON, SPEC, PLAN):',
              'for path in (CANON, SPEC, PLAN, EVIDENCE):',
              1,
          )
          old = '''        self.assertEqual("b9ba179232d7d3a35da7da3e85ce55fee1583503", "b9ba179232d7d3a35da7da3e85ce55fee1583503")
                  self.assertEqual(31064922435, 31064922435)
                  self.assertEqual(86, 86)
                  self.assertEqual("PASS", "PASS")
                  self.assertEqual(0, evidence.get("protected_product_path_changes"))'''
          new = '''        evidence_text = read_or_empty(EVIDENCE)
                  for token in (
                      "GREEN_SYNC_HEAD=b9ba179232d7d3a35da7da3e85ce55fee1583503",
                      "GREEN_ONE_SHOT_RUN=31064922435",
                      "GREEN_FOCUSED_PASS=86",
                      "GREEN_CORE_ALIGNMENT=PASS",
                      "GREEN_BASE_OPERATING_AUDIT=PASS",
                      "GREEN_PROTECTED_PRODUCT_PATH_CHANGES=0",
                  ):
                      self.assertIn(token, evidence_text)
                  self.assertEqual(0, evidence.get("protected_product_path_changes"))'''
          if old not in text:
              raise SystemExit('target evidence self-comparison block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m unittest tests.test_r2_function_recipe_material_fit_and_playtest -v
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name 'alsdmlals4-eng'
          git config user.email 'alsdmlals4@gmail.com'
          git rm .github/workflows/apply-final-batch-evidence-test-fix.yml
          git add tests/test_r2_function_recipe_material_fit_and_playtest.py
          git commit -m 'test: verify recorded final batch evidence'
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
