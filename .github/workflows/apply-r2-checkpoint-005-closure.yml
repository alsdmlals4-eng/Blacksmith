name: Apply R2 Checkpoint 005 Closure

on:
  push:
    branches:
      - agent/r2-checkpoint-005-postmerge-closure
    paths:
      - "tools/close_r2_checkpoint_005.py"
      - ".github/workflows/apply-r2-checkpoint-005-closure.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-checkpoint-005-postmerge-closure
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply idempotent closure sync
        run: python tools/close_r2_checkpoint_005.py
      - name: Commit generated authority updates
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No closure changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CURRENT_CONFIRMED_DECISIONS.md \
            docs/planning/CURRENT_R2_CANON_REGISTRY.json \
            docs/planning/BLACKSMITH_R2_CHECKPOINT_005_POSTMERGE_CLOSURE_2026.md \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/ROADMAP.md' \
            '[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md'
          git commit -m "CANON: synchronize R2 checkpoint 005 closure"
          git push origin HEAD:agent/r2-checkpoint-005-postmerge-closure
