name: Prove Toren Router Adversarial RED

on:
  push:
    branches:
      - agent/r3-toren-adventurer-02-design
    paths:
      - "tests/test_r3_adventurer_02_toren_content.py"
      - ".github/workflows/prove-toren-router-adversarial-red.yml"

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run Toren current-router regressions
        run: python -m unittest tests.test_r3_adventurer_02_toren_content -v
