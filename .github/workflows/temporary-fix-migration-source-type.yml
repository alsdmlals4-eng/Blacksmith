name: Correct migration authority source type

on:
  push:
    branches:
      - agent/rebuild-thin-base-adapter
    paths:
      - .github/workflows/temporary-fix-migration-source-type.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use the baseline canonical adapter as policy source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temporary-migrate-thin-base-adapter.yml')
          text = path.read_text(encoding='utf-8')
          old = '"policy_source_type": "FIRST_MIGRATION_LEGACY_SOURCE"'
          new = '"policy_source_type": "CANONICAL_ADAPTER_SOURCE"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one source-type token, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit corrected temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-migrate-thin-base-adapter.yml
          git diff --cached --check
          git commit -m "fix: use canonical adapter baseline authority"
          git push origin HEAD:agent/rebuild-thin-base-adapter
