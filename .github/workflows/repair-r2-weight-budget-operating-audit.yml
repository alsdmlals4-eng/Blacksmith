name: Repair R2 Weight Budget Operating Audit

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - tools/repair_r2_weight_budget_operating_audit.py
      - .github/workflows/repair-r2-weight-budget-operating-audit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 41a20584dd2ee51d917e5c9d7cab6838e1ceba7e
          path: base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply operating audit repair
        run: python tools/repair_r2_weight_budget_operating_audit.py
      - name: Verify project core alignment
        run: python tests/check_project_core_alignment.py
      - name: Verify focused planning contracts
        run: >-
          python -m unittest
          tests.test_base_v942_planning_first_adoption
          tests.test_r2_artistry_generation_growth_economy
          tests.test_r2_customer_equipment_compatibility
          tests.test_r2_mobile_customer_card_progressive_disclosure
          tests.test_r2_enhancement_dominant_simple_load_gate
          tests.test_r2_equipment_base_weight_points
          tests.test_r2_weight_performance_budget_and_lightweight_tradeoff
          -v
      - name: Verify operating audit wrapper
        run: |
          python -m unittest tests/test_project_operating_system_audit_runner.py
          python tools/run_project_operating_system_audit.py --base-root base --report artifacts/base-adoption-report.json
      - name: Remove one-shot files
        run: rm tools/repair_r2_weight_budget_operating_audit.py .github/workflows/repair-r2-weight-budget-operating-audit.yml
      - name: Commit and push repaired audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: align operating audit with weight budget canon"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
