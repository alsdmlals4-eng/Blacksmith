name: Apply Base v9.4 Adoption

on:
  pull_request:
    paths:
      - "tools/apply_base_v9_4_adoption.py"
      - ".github/workflows/apply-base-v9-4-adoption.yml"

permissions:
  contents: write

jobs:
  apply-adoption:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply deterministic migration
        run: python tools/apply_base_v9_4_adoption.py
      - name: Record explicit evidence-state labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('[기획서]/00_프로젝트_허브/AI_WORKFLOW.md')
          text = path.read_text(encoding='utf-8')
          old = '- 화면·Schema·Fixture는 실제 Android 런타임·사람 이해·성능을 자동 증명하지 않는다.'
          new = old + ' 실행하지 않은 Android·provider 검증은 `NOT_RUN`, 사람 이해·반복 피로는 `HUMAN_NOT_RUN`이다.'
          if new not in text:
              if old not in text:
                  raise SystemExit('evidence-limit source sentence missing')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused contracts
        run: |
          python -m unittest \
            tests.test_base_v9_adoption \
            tests.test_base_v94_ai_operations_adoption \
            -v
      - name: Commit exact migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json skills/PROJECT_SKILL_SNAPSHOT.json \
            skills/BASE_V9_ADAPTER.json skills/PROJECT_BASE_SKILL_ADAPTER.json \
            docs/BASE_RULES_VERSION.md docs/UX_UI_SYSTEM.md \
            docs/reviews/2026-08-01_BASE_V9_4_ADOPTION_AUDIT.md \
            '[기획서]/00_프로젝트_허브/AI_WORKFLOW.md' \
            '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
            '[기획서]/00_프로젝트_허브/DOCUMENTATION_MAP.md' \
            tests/test_base_v94_ai_operations_adoption.py
          git commit -m "chore: adopt Base v9.4 operating contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
