name: Add Simple Load Current Batch Marker

on:
  push:
    branches:
      - agent/r2-artistry-generation-growth-economy-design
    paths:
      - ".github/workflows/add-simple-load-current-batch-marker.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/r2-artistry-generation-growth-economy-design
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Add current refinement marker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/planning/BLACKSMITH_R2_CUSTOMER_CAPABILITY_AND_EQUIPMENT_COMPATIBILITY_CANON_2026.md")
          text = path.read_text(encoding="utf-8")
          marker = "<!-- ACTIVE_BATCH_REFINED_BY_BS-CUSTOMER-20260806-01 -->"
          if marker not in text:
              text = text.rstrip() + "\n\n" + marker + "\n현재 후속 정제 배치: `R2_BATCH_005_4_OF_10`\n"
              path.write_text(text, encoding="utf-8")
          PY
          python tests/check_project_core_alignment.py
          rm .github/workflows/add-simple-load-current-batch-marker.yml
      - name: Commit current marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: mark current simple load refinement batch"
          git push origin HEAD:agent/r2-artistry-generation-growth-economy-design
